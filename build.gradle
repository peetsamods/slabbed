plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            // Dev-run only. These arm Slabbed's debug surface for the whole parity campaign so a
            // live tester never has to remember a slash command: the /slabdy passive overlay AND
            // the live-cursor recorder both start already-on. Shipped defaults are untouched —
            // both read System.getProperty(..., "false"), and the recorder's whole package
            // (com/slabbed/dev/audit/**) is excluded from the release jar, so players are
            // unaffected. Drop -Dslabbed.liveCursorIntentRecorder when the campaign ends.
            vmArgs "-Dmixin.debug=true", "-Dmixin.verbose=true", "-Dmixin.dumpTargetOnFailure=true", "-Dslabbed.debug.sbsb=true", "-Dslabbed.targetDyOverlay=true", "-Dslabbed.liveCursorIntentRecorder=true"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
    }
}

// ── S-2 law-gate verdict toggle ───────────────────────────────────────────────────────────────
// NeighborUpdateInvarianceTest (the S-2 law gate) ALWAYS runs its full matrix — in either mode,
// every subject is built and every mutation applied. Only the VERDICT is conditional.
//
// DEFAULT (flipped 2026-08-06 by maintainer ruling, Phase 2's exit criterion met): ON — BLOCKING. Plain
// `./gradlew build runGameTest`, no flag, enforces LAW 1 directly: a violation throws.
// `-Dslabbed.lawGate=false` downgrades the verdict to CHARACTERIZATION — violations are PRINTED as
// "[LAW-GATE] CHARACTERIZATION" lines instead of thrown. That is the escape hatch for a session
// deliberately introducing a new RED subject and needing the inventory while it is fixed forward;
// it is never a way to land a known violation quietly. See LAW.md — this comment does not redefine
// the law. Either way the run prints one greppable "[LAW-GATE]" line per subject (CLEAN when none
// moved), so silence can never be mistaken for a run that did not happen.
//
// Gradle keeps `-D` on the daemon JVM, and Loom's run tasks are forked JavaExecs, so the property
// has to be forwarded explicitly. Loom appends its own args via getJvmArguments().addAll(...), so
// adding here is additive, not clobbering.
// ── Stage 4 deep-dy-alphabet toggle ───────────────────────────────────────────────────────────
// `slabbed.deepDyAlphabet` arms SlabSupport.MIN_RESOLVED_DY = -2.0. Default OFF (maintainer
// ruling, 2026-08-06): cells with a stored placement height never move, but every cell without one takes
// the live resolver and would drop half a block on first re-render. Same forwarding problem as the
// law gate — Gradle keeps `-D` on the daemon JVM and Loom's run tasks are forked JavaExecs — so it
// is passed through by name here. Run the deep leg with:
//     ./gradlew runGameTest -Dslabbed.deepDyAlphabet=true
tasks.matching { it.name == "runGameTest" }.configureEach {
    jvmArguments.addAll(
            providers.systemProperty("slabbed.lawGate")
                    .map { v -> ["-Dslabbed.lawGate=" + v] }
                    .orElse([])
    )
    jvmArguments.addAll(
            providers.systemProperty("slabbed.deepDyAlphabet")
                    .map { v -> ["-Dslabbed.deepDyAlphabet=" + v] }
                    .orElse([])
    )
    // Arms the RED_PENDING_RULING rows (documented open gaps that FAIL by design when armed).
    // Same forwarding problem as the flags above: a daemon -D never reaches the forked JVM.
    jvmArguments.addAll(
            providers.systemProperty("slabbed.redCells")
                    .map { v -> ["-Dslabbed.redCells=" + v] }
                    .orElse([])
    )
    finalizedBy("verifyGameTestCount")
}

// ── Suite-count gate ─────────────────────────────────────────────────────────────────────────
// A stale persisted world in build/run/gameTest can silently drop tests while still reporting
// BUILD SUCCESSFUL (observed live: 166 reported, ~65 lost, no warning). A green run is therefore
// NOT proof on its own: the reported count must equal the expected total computed from the
// registered classes. This task turns that manual check (tools/expected-gametest-count.py) into
// a machine gate: it runs after every runGameTest and FAILS the build on any mismatch.
tasks.register("verifyGameTestCount") {
    doLast {
        File log = file("build/run/gameTest/logs/latest.log")
        if (!log.exists()) {
            throw new GradleException("verifyGameTestCount: ${log} not found — runGameTest did not produce a log; cannot certify the suite count.")
        }
        def matches = log.readLines().findAll { it.contains("required tests passed") }
        if (matches.isEmpty()) {
            throw new GradleException("verifyGameTestCount: no 'required tests passed' line in ${log} — the suite did not complete.")
        }
        def m = (matches.last() =~ /All (\d+) required tests passed/)
        if (!m.find()) {
            throw new GradleException("verifyGameTestCount: could not parse the count from: ${matches.last()}")
        }
        int reported = m.group(1).toInteger()
        def proc = new ProcessBuilder("python3", "tools/expected-gametest-count.py")
                .directory(projectDir).redirectErrorStream(true).start()
        def out = proc.inputStream.text
        if (proc.waitFor() != 0) {
            throw new GradleException("verifyGameTestCount: tools/expected-gametest-count.py failed:\n${out}")
        }
        def em = (out =~ /expected suite count (\d+)/)
        if (!em.find()) {
            throw new GradleException("verifyGameTestCount: could not parse tools/expected-gametest-count.py output: ${out}")
        }
        int expected = em.group(1).toInteger()
        if (reported != expected) {
            throw new GradleException("verifyGameTestCount: FALSE GREEN — run reported ${reported} tests but ${expected} are registered. A stale run dir silently drops tests; rm -rf build/run/gameTest and re-run.")
        }
        logger.lifecycle("verifyGameTestCount: OK — ${reported}/${expected} (reported == expected).")
    }
}

// ── Hook auto-install ────────────────────────────────────────────────────────────────────────
// tools/hooks/commit-msg carries the S-1/S-4/S-5/S-6 gates, but git only runs it if
// core.hooksPath is set — and a fresh clone silently commits ungated. This wires the one-time
// `git config core.hooksPath tools/hooks` into the build so no checkout can forget it.
// Idempotent; warns instead of failing when git is unavailable (e.g. a source tarball).
tasks.register("prepareGitHooks") {
    doLast {
        if (!file(".git").exists()) {
            logger.lifecycle("prepareGitHooks: no .git here — skipped.")
            return
        }
        try {
            def proc = new ProcessBuilder("git", "config", "core.hooksPath", "tools/hooks")
                    .directory(projectDir).redirectErrorStream(true).start()
            def out = proc.inputStream.text
            if (proc.waitFor() == 0) {
                logger.lifecycle("prepareGitHooks: core.hooksPath = tools/hooks")
            } else {
                logger.warn("prepareGitHooks: git config failed (${out.trim()}) — commits are UNGATED until core.hooksPath is set manually.")
            }
        } catch (Exception e) {
            logger.warn("prepareGitHooks: could not set core.hooksPath (${e.message}) — commits are UNGATED until it is set manually.")
        }
    }
}
tasks.matching { it.name == "build" }.configureEach { dependsOn("prepareGitHooks") }

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    // Dev-runtime Terrain Slabs (+ architectury / midnightlib): drop any matching jar into
    // run/mods/ and it is loaded for runClient. Inert when absent. Picks up the release's
    // terrain_slabs-fabric-3.x (mod id "terrain_slabs") as well as the legacy 2.2.5.
    def terrainSlabsRuntimeJars = fileTree(dir: "${projectDir}/run/mods",
            include: ["*terrain*slab*.jar", "*architectury*.jar", "*midnightlib*.jar"])

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Client-only modules for the client source set when splitEnvironmentSourceSets is enabled.
    modClientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-renderer-api-v1:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-model-loading-api-v1:${project.fabric_version}"

    terrainSlabsRuntimeJars.each { jar ->
        modLocalRuntime files(jar)
    }

    // fabric-gametest-api-v1 is included in fabric-api bundle (already on main classpath,
    // extended to the gametest source set by configureTests { createSourceSet = true })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it's present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ── Pre-release hygiene gate: ONE exclusion list, BOTH artifacts ──────────────────────────────
// Exclude dev-only and debug-only content from the public release artifacts.
//
// This used to live inline inside `jar { ... }` and nowhere else. `withSourcesJar()` +
// Loom's `remapSourcesJar` build the sources artifact on a completely separate path with no
// filter of its own, so every single thing this list excludes from the mod jar was still
// shipping, in full source form, in slabbed-<version>-sources.jar — including
// com/slabbed/dev/audit/**, SlabRigCommand.java, and ScreenshotCaptureService.java, which
// reads and writes the OS system clipboard through java.awt.Toolkit. That is precisely what
// the note below says the exclusion exists to prevent. Hence one list, parameterised by file
// extension, applied to `jar` AND `sourcesJar`.
//
// com/slabbed/dev/** (top-level only) is intentionally NOT excluded: /slabdy and /slabdev must
// always ship. /slabdy is a client command registered unconditionally by SlabbedClient — its
// overlay defaults to off and the command toggles it. /slabdev is a server command registered
// unconditionally by Slabbed#initShippedDebugCommands, gated at op level 2 (GAMEMASTERS): not
// player-toggleable, op-invocable, and inert until invoked. That is the maintainer ruling (2026-08-07)
// on what "ships in every jar" has to mean — before it, /slabdev was registered only under
// isDevelopmentEnvironment() and SlabbedDevCommands shipped as unreachable bytes. Its `audit`
// subcommand reaches the dev-only audit harness reflectively and reports "not available in this
// build" when that harness is absent, which is the release case.
//
// com/slabbed/dev/audit/** IS excluded — the pre-release hygiene gate (standing maintainer rule):
// it's a file-writing dev/test harness (LiveCursorIntentRecorder, CategoryAuditRunner/Report,
// LoweredSideLiveHitRemapRuntimeAudit, probes), not player-facing UI, and shipping it risks
// moderation rejection regardless of the credential-redaction fix already applied to it. The 2
// always-shipped classes that reference it (SlabbedDevCommands, SlabdyClientCommands) go through
// SlabbedAuditBridge's reflection layer, not a hard import, so they load fine with this package
// absent.
//
// com/slabbed/mixin/recorder/** and com/slabbed/mixin/client/recorder/** are the five mixins that
// feed that recorder and do nothing else. They are declared in slabbed.recorder(.client).mixins
// .json, which is NOT referenced from fabric.mod.json and is added only by
// SlabbedDevMixinBootstrap in a development environment — so they cannot apply to a release build
// even if a class did survive. Both configs are excluded here too.
//
// com/slabbed/command/** IS excluded for the same reason — it is the /slabrig dev scene rig
// (a live-test structure builder, not player-facing tooling). The 26.2 line shipped /slabrig
// in its RELEASE JAR and that was logged as a defect; this exclusion is the gate that stops it
// happening on this line. com/slabbed/util/SlabTestKit goes with it (the rig's item list —
// dev-only data, referenced by nothing that ships). Slabbed#initDevOnlyFeatures reaches the rig
// reflectively, so both classes are safe to be absent.
//
// BlockStateCanPlaceAtChainDebugMixin has its `package` line commented out along with the rest of
// the file, so its SOURCE lands at the archive ROOT rather than under com/slabbed/mixin/debug/.
// A path-prefixed rule misses it. The `**/` form matches zero directories as well as many, so the
// one pattern covers it at the root today and under its package if it is ever uncommented.
def slabbedHygieneExcludes = { String ext ->
    [
            "com/slabbed/dev/audit/**",
            "com/slabbed/command/**",
            "com/slabbed/debug/**",
            "com/slabbed/client/debug/**",
            "com/slabbed/mixin/debug/**",
            "com/slabbed/mixin/recorder/**",
            "com/slabbed/mixin/client/recorder/**",
            "com/slabbed/util/SlabTestKit.${ext}",
            "com/slabbed/util/SlabbedDebug.${ext}",
            "com/slabbed/dev/SlabbedLab.${ext}",
            "com/slabbed/dev/SlabbedLabFixtures*.${ext}",
            "com/slabbed/client/GapFillerOverlay.${ext}",
            "com/slabbed/client/ScreenshotCaptureContext*.${ext}",
            "com/slabbed/client/ScreenshotCaptureService*.${ext}",
            "com/slabbed/client/CaptureProfile.${ext}",
            "**/BlockStateCanPlaceAtChainDebugMixin.${ext}",
            "**/.gitkeep",
            "slabbed.debug.mixins.json",
            "slabbed.recorder.mixins.json",
            "slabbed.recorder.client.mixins.json",
    ].collect { it.toString() }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }

    exclude(slabbedHygieneExcludes("class"))
}

tasks.named("sourcesJar", Jar) {
    exclude(slabbedHygieneExcludes("java"))
}

// ── Manifest hygiene: never advertise a class the artifact does not contain ───────────────────
// Loom computes Fabric-Loom-Client-Only-Entries from the CLIENT SOURCE SET OUTPUT, not from the
// entries that survive into the artifact, and it does so inside AbstractRemapJarTask#submitWork
// where there is no subtractive hook — getAdditionalClientOnlyEntries() is additive only. So the
// released manifest named five classes that the exclusion list above had already removed
// (ScreenshotCaptureService and its inner classes, CaptureProfile, GapFillerOverlay,
// client/debug/BsFbLiveTraceClient), and the sources manifest named their .java counterparts.
//
// Least-bad option, and the one chosen: prune the attribute against the finished archive itself.
// This is stated as a subtraction of names that are not present, so it cannot remove a real entry,
// and it cannot go stale — whatever the exclusion list becomes later, the manifest is re-derived
// from what is actually in the jar. Runs in doLast, so Gradle snapshots the pruned artifact as
// the task output and up-to-date checking still works.
def pruneClientOnlyEntriesManifest = { File artifact ->
    String attribute = "Fabric-Loom-Client-Only-Entries"
    Map<String, byte[]> contents = new LinkedHashMap<>()
    Map<String, Long> times = new LinkedHashMap<>()
    Set<String> directories = new LinkedHashSet<>()

    new java.util.zip.ZipFile(artifact).withCloseable { zip ->
        for (entry in zip.entries()) {
            times.put(entry.name, entry.time)
            if (entry.directory) {
                directories.add(entry.name)
                contents.put(entry.name, new byte[0])
            } else {
                contents.put(entry.name, zip.getInputStream(entry).bytes)
            }
        }
    }

    byte[] manifestBytes = contents.get("META-INF/MANIFEST.MF")
    if (manifestBytes == null) {
        return
    }
    def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(manifestBytes))
    String declared = manifest.mainAttributes.getValue(attribute)
    if (declared == null || declared.isEmpty()) {
        return
    }

    List<String> present = declared.split(";").findAll { contents.containsKey(it) }
    List<String> missing = declared.split(";").findAll { !contents.containsKey(it) }
    if (missing.isEmpty()) {
        return
    }

    if (present.isEmpty()) {
        manifest.mainAttributes.remove(new java.util.jar.Attributes.Name(attribute))
    } else {
        manifest.mainAttributes.putValue(attribute, present.join(";"))
    }
    def rewritten = new ByteArrayOutputStream()
    manifest.write(rewritten)
    contents.put("META-INF/MANIFEST.MF", rewritten.toByteArray())

    def rebuilt = new File(artifact.parentFile, artifact.name + ".manifest-pruned")
    new java.util.zip.ZipOutputStream(new FileOutputStream(rebuilt)).withCloseable { out ->
        contents.each { name, bytes ->
            def entry = new java.util.zip.ZipEntry(name)
            long time = times.get(name)
            if (time >= 0) {
                entry.time = time
            }
            out.putNextEntry(entry)
            if (!directories.contains(name)) {
                out.write(bytes)
            }
            out.closeEntry()
        }
    }
    java.nio.file.Files.move(rebuilt.toPath(), artifact.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("[hygiene] ${artifact.name}: dropped ${missing.size()} " +
            "${attribute} name(s) with no matching archive entry: ${missing.join(', ')}")
}

tasks.matching { it.name == "remapJar" || it.name == "remapSourcesJar" }.configureEach {
    doLast { task -> pruneClientOnlyEntriesManifest(task.archiveFile.get().asFile) }
}

// ─────────────────────────────────────────────────────────────────────────────────────────────
// Release artifact allowlist — the INVERTED hygiene gate.
//
// slabbedHygieneExcludes above is a list of things to DROP. It cannot see a package nobody thought
// to name. That is not hypothetical: on the 26.2 line a whole new com/slabbed/client/palette/**
// screen and com/slabbed/command/** (/slabrig) matched nothing in any exclusion or denylist and
// shipped in release/mc262-0.5.0-alpha.1. Under an exclusion list anything NEW ships by default.
//
// This gate is closed-world: every logical unit reaching a published artifact must match a reviewed
// row in RELEASE_ALLOWLIST.md, and the build FAILS naming anything that does not. The exclusion
// list is retained unchanged and is still the mechanism for REMOVING content; this gate is the
// assertion that what remains was actually looked at. See RELEASE_ALLOWLIST.md.
//
// WHICH ARTIFACTS: this line uses Yarn mappings and Loom DOES register remapJar/remapSourcesJar
// (confirmed via `./gradlew tasks --all`), so `jar`/`sourcesJar` are intermediate -dev products in
// build/devlibs/ and the REMAPPED outputs in build/libs/ are what ships. The gate reads the remap
// tasks' archives. That also puts it downstream of the manifest prune above, so it sees final
// bytes. (The 26.2 line has no remap tasks and its gate reads jar/sourcesJar; copying that here
// would check a file nobody publishes.)
// ─────────────────────────────────────────────────────────────────────────────────────────────

def releaseAllowlistFile = rootProject.file("RELEASE_ALLOWLIST.md")

// The two tasks that produce the published artifacts, in the order they are reported.
def releaseArtifactTaskNames = ["remapJar", "remapSourcesJar"]

// Collapse an archive entry to a "logical unit" so ONE allowlist row covers a class, its nest
// members and its source file: Foo.class, Foo$Bar.class and Foo.java all key to ".../Foo".
// Anything that is not a class or a source keeps its literal path (fabric.mod.json, assets/...).
def releaseLogicalUnit = { String entryName ->
    def name = entryName
    if (name.endsWith(".class")) {
        name = name.substring(0, name.length() - ".class".length())
        int lastSlash = name.lastIndexOf('/')
        int nest = name.indexOf('$', lastSlash + 1)
        if (nest >= 0) {
            name = name.substring(0, nest)
        }
    } else if (name.endsWith(".java")) {
        name = name.substring(0, name.length() - ".java".length())
    }
    return name
}

// pkg/**  -> that package and every subpackage, recursively (resource trees only, by policy)
// pkg/*   -> DIRECT members only; a brand-new subpackage is NOT covered. This is the palette
//            failure encoded as a rule.
// pkg/Foo -> exactly that one logical unit
def releaseAllowlistMatches = { String pattern, String unit ->
    if (pattern.endsWith("/**")) {
        return unit.startsWith(pattern.substring(0, pattern.length() - 2))
    }
    if (pattern.endsWith("/*")) {
        def prefix = pattern.substring(0, pattern.length() - 1)
        return unit.startsWith(prefix) && !unit.substring(prefix.length()).contains("/")
    }
    return unit == pattern
}

// Reads the "## Approved ..." sections of RELEASE_ALLOWLIST.md. Only table rows whose first cell is
// a backticked token count as entries, and only inside an "## Approved" section — the explanatory
// tables elsewhere in the document are documentation, not approvals. A row with an empty reason
// cell is a build failure: an approval nobody had to justify is how the list rots.
def parseReleaseAllowlist = { File file ->
    if (!file.exists()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md is missing at ${file.absolutePath}.\n"
                        + "The release allowlist is mandatory. Restore it from git — deleting it is\n"
                        + "not a way to make this gate pass.")
    }
    def approved = new LinkedHashMap<String, String>()
    boolean inApprovedSection = false
    file.eachLine("UTF-8") { rawLine ->
        def line = rawLine.trim()
        if (line.startsWith("## ")) {
            inApprovedSection = line.toLowerCase(java.util.Locale.ROOT).startsWith("## approved")
            return
        }
        if (!inApprovedSection || !line.startsWith("|")) {
            return
        }
        def cells = line.split("\\|", -1).collect { it.trim() }
        if (cells.size() < 4) {
            return
        }
        def entry = cells[1]
        def reason = cells[2]
        if (entry.length() <= 2 || !entry.startsWith("`") || !entry.endsWith("`")) {
            return
        }
        entry = entry.substring(1, entry.length() - 1).trim()
        if (entry.isEmpty()) {
            return
        }
        if (reason.replace("`", "").trim().isEmpty()) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md entry '${entry}' has no reason.\n"
                            + "An approval with no reason is how the list rots. Give it one.")
        }
        if (approved.containsKey(entry)) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md lists '${entry}' twice. Keep one row per entry.")
        }
        approved.put(entry, reason)
    }
    if (approved.isEmpty()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md parsed to zero approved entries.\n"
                        + "Either the '## Approved' sections were emptied or the table format was broken.\n"
                        + "Entry rows must look like: | `com/slabbed/pkg/*` | reason |")
    }
    return approved
}

// A published artifact must not advertise a class it does not contain. Loom derives
// Fabric-Loom-Client-Only-Entries from the client source set OUTPUT rather than from what survives
// into the archive, so before 207863f0 the released manifest named five classes the exclusion list
// had already removed. The doLast prune above fixes it; THIS is the assertion that keeps it fixed,
// independent of whatever the exclusion list becomes later.
def scanReleaseManifest = { java.util.zip.ZipFile zip, Set<String> entryNames ->
    def phantoms = new TreeSet<String>()
    def manifestEntry = zip.getEntry("META-INF/MANIFEST.MF")
    if (manifestEntry == null) {
        return phantoms
    }
    def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
    ["Fabric-Loom-Client-Only-Entries"].each { attribute ->
        String declared = manifest.mainAttributes.getValue(attribute)
        if (declared == null || declared.isEmpty()) {
            return
        }
        declared.split(";").each { name ->
            if (!name.trim().isEmpty() && !entryNames.contains(name)) {
                phantoms.add("${attribute}: ${name}".toString())
            }
        }
    }
    return phantoms
}

// Returns [unapproved: Map<unit, SortedSet<archiveName>>, stale: SortedSet<pattern>,
//          phantoms: Map<archiveName, SortedSet<String>>, counts: Map<archiveName, int>]
def scanReleaseArtifacts = { List<File> archives ->
    def approved = parseReleaseAllowlist(releaseAllowlistFile)
    def unapproved = new TreeMap<String, TreeSet<String>>()
    def matchedPatterns = new HashSet<String>()
    def phantoms = new TreeMap<String, TreeSet<String>>()
    def counts = new TreeMap<String, Integer>()
    archives.each { archive ->
        if (!archive.exists()) {
            throw new GradleException(
                    "Release artifact ${archive.absolutePath} does not exist; cannot verify it.")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entryNames = new LinkedHashSet<String>()
            def fileCount = 0
            zip.entries().each { entry ->
                entryNames.add(entry.name)
                if (entry.directory) {
                    return
                }
                fileCount++
                def unit = releaseLogicalUnit(entry.name)
                def hit = approved.keySet().find { pattern ->
                    releaseAllowlistMatches(pattern, unit)
                }
                if (hit != null) {
                    matchedPatterns.add(hit)
                } else {
                    unapproved.computeIfAbsent(unit, { new TreeSet<String>() }).add(archive.name)
                }
            }
            counts.put(archive.name, fileCount)
            def archivePhantoms = scanReleaseManifest(zip, entryNames)
            if (!archivePhantoms.isEmpty()) {
                phantoms.put(archive.name, archivePhantoms)
            }
        }
    }
    def stale = new TreeSet<String>(approved.keySet())
    stale.removeAll(matchedPatterns)
    return [unapproved: unapproved, stale: stale, phantoms: phantoms, counts: counts]
}

def releaseAllowlistArchives = { ->
    releaseArtifactTaskNames.collect { name ->
        tasks.named(name).get().archiveFile.get().asFile
    }
}

tasks.register("verifyReleaseAllowlist") {
    group = "verification"
    description = "Fails naming every class or resource that reaches a published artifact without "  +
            "an approved entry in RELEASE_ALLOWLIST.md, and every manifest name with no archive entry."
    releaseArtifactTaskNames.each { dependsOn(tasks.named(it)) }
    releaseArtifactTaskNames.each { name ->
        inputs.files(tasks.named(name).flatMap { it.archiveFile })
    }
    inputs.file(releaseAllowlistFile)

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())

        if (!result.stale.isEmpty()) {
            logger.warn("RELEASE_ALLOWLIST.md has {} entry/entries that match nothing in either "
                    + "published artifact (stale approvals rot the list): {}",
                    result.stale.size(), result.stale.join(", "))
        }

        if (!result.phantoms.isEmpty()) {
            def detail = result.phantoms.collect { archiveName, names ->
                "  ${archiveName}\n" + names.collect { "      ${it}" }.join("\n")
            }.join("\n")
            throw new GradleException(
                    "Release manifest violation: a published artifact advertises name(s) it does "
                            + "not contain.\n\n" + detail + "\n\n"
                            + "A jar that lies about its own contents is a release defect even when "
                            + "every entry in it\n"
                            + "is approved. This is what pruneClientOnlyEntriesManifest exists to "
                            + "prevent; if this fires,\n"
                            + "that prune stopped running or stopped covering an attribute.")
        }

        if (!result.unapproved.isEmpty()) {
            def detail = result.unapproved.collect { unit, archiveNames ->
                "  ${unit}\n      reached: ${archiveNames.join(', ')}"
            }.join("\n")
            throw new GradleException(
                    "Release allowlist violation: ${result.unapproved.size()} unit(s) reached a "
                            + "published artifact with no approved entry in RELEASE_ALLOWLIST.md.\n\n"
                            + detail + "\n\n"
                            + "Two legitimate responses for EACH entry above:\n"
                            + "  1. EXCLUDE it — add it to slabbedHygieneExcludes in build.gradle "
                            + "(ONE list, both\n"
                            + "     artifacts), and gate or remove whatever registers it, then rebuild.\n"
                            + "  2. APPROVE it — add a row under an \"## Approved\" heading in "
                            + "RELEASE_ALLOWLIST.md\n"
                            + "     with a reason that would survive review. Package rows are "
                            + "`pkg/*` (direct members\n"
                            + "     only, NOT subpackages) or `pkg/**` (recursive, resource trees "
                            + "only); a bare path is\n"
                            + "     a single logical unit.\n\n"
                            + "Widening an existing pattern purely to make this green is neither. "
                            + "This gate is closed-world\n"
                            + "on purpose: anything new fails by default, because anything new used "
                            + "to SHIP by default.\n"
                            + "Run ./gradlew releaseAllowlistReport --continue for the same list "
                            + "without failing that task.")
        }

        println("RELEASE_ALLOWLIST_VERIFY artifacts=${result.counts.size()} "
                + "entries=${result.counts.collect { k, v -> "${k}:${v}" }.join(' ')} "
                + "unapproved=0 manifestPhantoms=0 stale=${result.stale.size()}")
    }
}

tasks.register("releaseAllowlistReport") {
    group = "verification"
    description = "Prints every unapproved unit in the published artifacts WITHOUT failing. Review " +
            "aid only — it does not bypass verifyReleaseAllowlist."
    releaseArtifactTaskNames.each { dependsOn(tasks.named(it)) }
    releaseArtifactTaskNames.each { name ->
        inputs.files(tasks.named(name).flatMap { it.archiveFile })
    }
    inputs.file(releaseAllowlistFile)
    outputs.file(layout.buildDirectory.file("reports/release-allowlist/unapproved.txt"))

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())
        def lines = []
        lines.add("# Units reaching a published artifact with no approved RELEASE_ALLOWLIST.md entry")
        lines.add("# unapproved=${result.unapproved.size()} stale=${result.stale.size()} "
                + "manifestPhantoms=${result.phantoms.values().sum { it.size() } ?: 0}")
        result.counts.each { archiveName, count ->
            lines.add("# ARTIFACT ${archiveName}\t${count} file entries")
        }
        result.unapproved.each { unit, archiveNames ->
            lines.add("UNAPPROVED ${unit}\t${archiveNames.join(', ')}")
        }
        result.phantoms.each { archiveName, names ->
            names.each { lines.add("MANIFEST-PHANTOM ${archiveName}\t${it}") }
        }
        result.stale.each { pattern ->
            lines.add("STALE ${pattern}\t(approved but matches nothing)")
        }
        def reportFile = outputs.files.singleFile
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
        println(lines.join("\n"))
        println("RELEASE_ALLOWLIST_REPORT ${reportFile.absolutePath}")
    }
}

tasks.named("build") {
    dependsOn(tasks.named("verifyReleaseAllowlist"))
}

// dependsOn on `build` alone is not enough: `gradle assemble`, `gradle remapJar` and
// `gradle publish` all produce or consume a published artifact without going through `build`.
// finalizedBy on the two REMAP tasks makes the gate run whenever a published artifact is produced,
// by ANY entry point — so it is not possible to end up holding an artifact that was never checked.
// It is on remapJar/remapSourcesJar rather than jar/sourcesJar for two reasons: those are the
// artifacts that actually ship, and finalizing them sequences the gate AFTER the manifest prune's
// doLast, so it reads the final bytes.
tasks.matching { releaseArtifactTaskNames.contains(it.name) }.configureEach {
    finalizedBy(tasks.named("verifyReleaseAllowlist"))
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // fetching dependencies.
    }
}
