tasks.register("verifyP8TerrainSlabsDependencies") {
    doLast {
        def expected = [
                "countereds-terrain-slabs": "56d52bd9864423d8d8e2b6cf88d3533824b2ab64e3947e039d3d90bcc4d69e43b2dc56046f4f9e7c7cb9baa384bb3757d7ff18d70690888f54c3755bfbb7b593",
                "architectury-api": "65e3664953385d880320dd6bb818bcb96d361c07c53e2a7f65e64c6a47720ee26b233224ae9cad465ef0b2bbaefdaf30fb0175a983cecd91de058817d6fcf57e"
        ]
        def artifacts = configurations.p8testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == "maven.modrinth" }
        expected.each { name, expectedHash ->
            def matches = artifacts.findAll { it.name == name }
            if (matches.size() != 1) {
                throw new GradleException("Expected exactly one P8 dependency artifact for " + name)
            }
            def digest = java.security.MessageDigest.getInstance("SHA-512")
            matches.first().file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            String actualHash = digest.digest().encodeHex().toString()
            if (actualHash != expectedHash) {
                throw new GradleException("P8 dependency hash mismatch for " + name)
            }
        }
        logger.lifecycle("P8 dependency identity verified: Terrain Slabs 3.1.2 and Architectury 13.0.8")
    }
}

