tasks.register("verifyP8TerrainSlabsProof") {
    dependsOn(tasks.named("runP8TerrainSlabsClient"))
    doLast {
        File proofDirectory = p8ProofDirectory.get().dir("proof").asFile
        File receipt = new File(proofDirectory, "p8-terrain-slabs.ok")
        File failure = new File(proofDirectory, "p8-terrain-slabs.failed")
        String expected = "versions=true classification=true vanilla_slab=true flat=true visual=true collision_gap=true raycast=true no_compounding=true\n"
        if (!receipt.isFile() || receipt.getText("UTF-8") != expected) {
            // Distinguish the three cases. A receipt that exists but does not match reads as
            // "missing receipt" otherwise, which sends the reader looking for the wrong problem -
            // usually a lane change that did not update this literal in lockstep.
            String detail
            if (failure.isFile()) {
                detail = failure.getText("UTF-8").trim()
            } else if (!receipt.isFile()) {
                detail = "no receipt was written"
            } else {
                detail = "receipt does not match the expected flags; got: " + receipt.getText("UTF-8").trim()
            }
            throw new GradleException("The P8 Terrain Slabs proof did not pass: " + detail)
        }
        if (failure.exists()) {
            throw new GradleException("The P8 Terrain Slabs proof retained a failure receipt")
        }
        logger.lifecycle("P8 Terrain Slabs proof verified: real-mod classification, the ruled support gap, and non-compounding")
    }
}

