tasks.register("verifyReleaseAllowlist") {
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    doLast {
        def artifacts = [
                [kind: "runtime", file: tasks.named("jar").get().archiveFile.get().asFile],
                [kind: "sources", file: tasks.named("sourcesJar").get().archiveFile.get().asFile]
        ]
        artifacts.each { artifact ->
            def process = new ProcessBuilder(
                    "python3",
                    "tools/verify-release-allowlist.py",
                    "--artifact",
                    artifact.file.absolutePath,
                    "--kind",
                    artifact.kind
            ).directory(project.projectDir).redirectErrorStream(true).start()
            String output = process.inputStream.getText("UTF-8").trim()
            if (process.waitFor() != 0) {
                throw new GradleException(output)
            }
            logger.lifecycle(output)
        }
    }
}

// String-level hygiene gate: no shipping archive entry may even NAME the dev-diagnostics
// classes. This is why the release-safe seam is a no-op bridge — the boundary stays
// un-regressable even if a future refactor moves a class between source sets.
tasks.register("verifyReleaseJarHygiene") {
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    doLast {
        def forbiddenTokens = [
                "LiveCursorIntentRecorder",
                "SlabModelStaleSentinel",
                "TargetDyOverlay",
                "SlabbedDevtools",
                "SlabRigCommand",
                "SlabTestKit",
                "slabbed_devtools"
        ]
        [tasks.named("jar").get().archiveFile.get().asFile,
         tasks.named("sourcesJar").get().archiveFile.get().asFile].each { archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.isDirectory()) {
                        return
                    }
                    String bytes = new String(zip.getInputStream(entry).readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1)
                    forbiddenTokens.each { token ->
                        if (bytes.contains(token)) {
                            throw new GradleException("Release hygiene violation: "
                                    + archive.name + " entry " + entry.name
                                    + " names forbidden dev token '" + token + "'")
                        }
                    }
                }
            }
            logger.lifecycle("Release jar hygiene verified: " + archive.name
                    + " (no dev-diagnostics tokens)")
        }
    }
}

tasks.named("build").configure {
    dependsOn(tasks.named("verifyReleaseAllowlist"))
    dependsOn(tasks.named("verifyReleaseJarHygiene"))
}

// A bare `gradle jar` must never yield an unchecked artifact. The release gates finalize the
// archive tasks themselves, so every route that produces a jar is gated, not only `build`.
tasks.named("jar").configure {
    finalizedBy(tasks.named("verifyReleaseAllowlist"), tasks.named("verifyReleaseJarHygiene"))
}

tasks.named("sourcesJar").configure {
    finalizedBy(tasks.named("verifyReleaseAllowlist"), tasks.named("verifyReleaseJarHygiene"))
}

