plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            // Dev-run only. These arm Slabbed's debug surface for the whole parity campaign so a
            // live tester never has to remember a slash command: the /slabdy passive overlay AND
            // the live-cursor recorder both start already-on. Shipped defaults are untouched —
            // both read System.getProperty(..., "false"), and the recorder's whole package
            // (com/slabbed/dev/audit/**) is excluded from the release jar, so players are
            // unaffected. Drop -Dslabbed.liveCursorIntentRecorder when the campaign ends.
            vmArgs "-Dmixin.debug=true", "-Dmixin.verbose=true", "-Dmixin.dumpTargetOnFailure=true", "-Dslabbed.debug.sbsb=true", "-Dslabbed.targetDyOverlay=true", "-Dslabbed.liveCursorIntentRecorder=true"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
    }
}

// ── S-2 law-gate verdict toggle ───────────────────────────────────────────────────────────────
// NeighborUpdateInvarianceTest (the S-2 law gate) ALWAYS runs its full matrix. By default it
// reports LAW 1 violations as "[LAW-GATE] CHARACTERIZATION" lines instead of throwing, because
// LAW.md states this line does not yet obey LAW 1 (that is Phase 2's job) and a red CI on an
// expected state teaches everyone to ignore CI. `-Dslabbed.lawGate=true` makes it blocking again;
// flipping that default to ON is Phase 2's exit criterion.
//
// Gradle keeps `-D` on the daemon JVM, and Loom's run tasks are forked JavaExecs, so the property
// has to be forwarded explicitly. Loom appends its own args via getJvmArguments().addAll(...), so
// adding here is additive, not clobbering.
tasks.matching { it.name == "runGameTest" }.configureEach {
    jvmArguments.addAll(
            providers.systemProperty("slabbed.lawGate")
                    .map { v -> ["-Dslabbed.lawGate=" + v] }
                    .orElse([])
    )
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    // Dev-runtime Terrain Slabs (+ architectury / midnightlib): drop any matching jar into
    // run/mods/ and it is loaded for runClient. Inert when absent. Picks up the release's
    // terrain_slabs-fabric-3.x (mod id "terrain_slabs") as well as the legacy 2.2.5.
    def terrainSlabsRuntimeJars = fileTree(dir: "${projectDir}/run/mods",
            include: ["*terrain*slab*.jar", "*architectury*.jar", "*midnightlib*.jar"])

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Client-only modules for the client source set when splitEnvironmentSourceSets is enabled.
    modClientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-renderer-api-v1:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-model-loading-api-v1:${project.fabric_version}"

    terrainSlabsRuntimeJars.each { jar ->
        modLocalRuntime files(jar)
    }

    // fabric-gametest-api-v1 is included in fabric-api bundle (already on main classpath,
    // extended to the gametest source set by configureTests { createSourceSet = true })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it's present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }

    // Exclude dev-only and debug-only content from public release jar.
    // com/slabbed/dev/** (top-level only) is intentionally NOT excluded: /slabdy and
    // /slabdev's own overlay/toggle commands must always ship (default-off,
    // player-toggleable via slash command) — see SlabbedDevCommands and
    // SlabdyClientCommands.
    //
    // com/slabbed/dev/audit/** IS excluded — the pre-release hygiene gate (Maintainer's
    // standing rule): it's a file-writing dev/test harness (LiveCursorIntentRecorder,
    // CategoryAuditRunner/Report, LoweredSideLiveHitRemapRuntimeAudit, probes), not
    // player-facing UI, and shipping it risks moderation rejection regardless of the
    // credential-redaction fix already applied to it. The 2 always-shipped classes that
    // reference it (SlabbedDevCommands, SlabdyClientCommands) go through
    // SlabbedAuditBridge's reflection layer, not a hard import, so they load fine with
    // this package absent.
    //
    // com/slabbed/command/** IS excluded for the same reason — it is the /slabrig dev scene rig
    // (a live-test structure builder, not player-facing tooling). The 26.2 line shipped /slabrig
    // in its RELEASE JAR and that was logged as a defect; this exclusion is the gate that stops it
    // happening on this line. com/slabbed/util/SlabTestKit.class goes with it (the rig's item list
    // — dev-only data, referenced by nothing that ships). Slabbed#initDevFeatures reaches the rig
    // reflectively, so both classes are safe to be absent.
    exclude("com/slabbed/dev/audit/**")
    exclude("com/slabbed/command/**")
    exclude("com/slabbed/util/SlabTestKit.class")
    exclude("com/slabbed/dev/SlabbedLab.class")
    exclude("com/slabbed/dev/SlabbedLabFixtures*.class")
    exclude("com/slabbed/debug/**")
    exclude("com/slabbed/client/debug/**")
    exclude("com/slabbed/mixin/debug/**")
    exclude("com/slabbed/client/GapFillerOverlay.class")
    exclude("com/slabbed/client/ScreenshotCaptureContext*.class")
    exclude("com/slabbed/client/ScreenshotCaptureService*.class")
    exclude("com/slabbed/client/CaptureProfile.class")
    exclude("com/slabbed/util/SlabbedDebug.class")
    exclude("slabbed.debug.mixins.json")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // fetching dependencies.
    }
}
