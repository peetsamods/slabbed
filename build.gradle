sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
sourceSets.test.compileClasspath += sourceSets.devtools.output + sourceSets.devtools.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.devtools.output + sourceSets.devtools.runtimeClasspath

tasks.named("test").configure {
    dependsOn(tasks.named("devtoolsClasses"))
    systemProperty "slabbed.devGitSha", slabbedGitSha
    systemProperty "slabbed.devBuildTime", slabbedBuildTime
    useJUnitPlatform()
}

tasks.named("sourcesJar").configure {
    exclude slabbedReleaseExcludes
    exclude "fabric.mod.json", "slabbed.debug.mixins.json"
}

tasks.register("cleanGameTestRunDirectory", Delete) {
    delete gameTestDirectory
}

tasks.register("syncGameTestStructures", Sync) {
    dependsOn(tasks.named("cleanGameTestRunDirectory"))
    from("gameteststructures")
    into(gameTestDirectory.map { directory -> directory.dir("gameteststructures") })
}

tasks.named("runServerGameTest").configure {
    dependsOn(tasks.named("syncGameTestStructures"))
}

tasks.register("cleanParityServerRunDirectory", Delete) {
    delete parityServerDirectory
}

// The parity server keeps its own game directory so a dedicated-server run can never
// read or write the shared developer run directory. Preparation is idempotent so a
// second run reuses the same world and proves persistence across a real restart;
// use cleanParityServerRunDirectory for a fresh world.
tasks.register("prepareParityServerRunDirectory") {
    outputs.dir(parityServerDirectory)
    doLast {
        File directory = parityServerDirectory.get().asFile
        if (!directory.mkdirs() && !directory.isDirectory()) {
            throw new GradleException("Could not create the parity server directory")
        }
        new File(directory, "eula.txt").setText("eula=true\n", "UTF-8")
        new File(directory, "server.properties").setText(
                "level-name=saves/parity-world\n"
                        + "online-mode=false\n"
                        + "spawn-protection=0\n"
                        + "view-distance=4\n"
                        + "simulation-distance=4\n"
                        + "sync-chunk-writes=true\n",
                "UTF-8")
    }
}

tasks.named("runParityServer").configure {
    dependsOn(tasks.named("prepareParityServerRunDirectory"))
    standardInput = System.in
}

tasks.register("cleanP2bProofRunDirectory", Delete) {
    delete p2bProofDirectory
}

tasks.register("prepareP2bProofRunDirectory") {
    dependsOn(tasks.named("cleanP2bProofRunDirectory"))
    outputs.dir(p2bProofDirectory)
    doLast {
        File directory = p2bProofDirectory.get().asFile
        if (!directory.mkdirs() && !directory.isDirectory()) {
            throw new GradleException("Could not create the P2b proof directory")
        }
        new File(directory, "eula.txt").setText("eula=true\n", "UTF-8")
        new File(directory, "server.properties").setText(
                "level-name=saves/p2b-proof\n"
                        + "online-mode=false\n"
                        + "spawn-protection=0\n"
                        + "view-distance=4\n"
                        + "simulation-distance=4\n",
                "UTF-8")
    }
}

tasks.named("runP2bPersistenceWriter").configure {
    dependsOn(tasks.named("prepareP2bProofRunDirectory"))
}

tasks.named("runP2bClientSync").configure {
    mustRunAfter(tasks.named("runP2bPersistenceWriter"))
}

tasks.register("verifyP2bLifecycleProof") {
    dependsOn(tasks.named("runP2bPersistenceWriter"), tasks.named("runP2bClientSync"))
    doLast {
        File proofDirectory = p2bProofDirectory.get().dir("proof").asFile
        File writerReceipt = new File(proofDirectory, "writer.ok")
        File clientReceipt = new File(proofDirectory, "client.ok")
        File clientFailure = new File(proofDirectory, "client.failed")
        if (!writerReceipt.isFile()
                || writerReceipt.getText("UTF-8") != "writer=green\n") {
            throw new GradleException("The P2b disk writer did not produce its exact receipt")
        }
        if (!clientReceipt.isFile()
                || clientReceipt.getText("UTF-8")
                != "initial=true update=true removal=true reset=true reconnect=true\n") {
            throw new GradleException("The P2b client did not produce its exact lifecycle receipt")
        }
        if (clientFailure.exists()) {
            throw new GradleException("The P2b client recorded a failed lifecycle phase")
        }
        logger.lifecycle("P2b lifecycle proof verified: disk, sync, removal, reset, reconnect")
    }
}

tasks.register("runP2bLifecycleProof") {
    group = "verification"
    description = "Runs the isolated two-process P2b persistence and connected-client proof."
    dependsOn(tasks.named("verifyP2bLifecycleProof"))
}

tasks.register("cleanP10cProofRunDirectory", Delete) {
    delete p10cProofDirectory
}

def writeP10cServerProperties = { String levelName ->
    File directory = p10cProofDirectory.get().asFile
    new File(directory, "server.properties").setText(
            "level-name=saves/" + levelName + "\n"
                    + "online-mode=false\n"
                    + "spawn-protection=0\n"
                    + "view-distance=4\n"
                    + "simulation-distance=4\n",
            "UTF-8")
}

tasks.register("prepareP10cProofRunDirectory") {
    dependsOn(tasks.named("cleanP10cProofRunDirectory"))
    outputs.dir(p10cProofDirectory)
    doLast {
        File directory = p10cProofDirectory.get().asFile
        if (!directory.mkdirs() && !directory.isDirectory()) {
            throw new GradleException("Could not create the P10C proof directory")
        }
        new File(directory, "eula.txt").setText("eula=true\n", "UTF-8")
    }
}

tasks.named("runP10cOffWriter").configure {
    dependsOn(tasks.named("prepareP10cProofRunDirectory"))
    doFirst {
        writeP10cServerProperties("p10c-off")
    }
}

tasks.named("runP10cEnabledWriter").configure {
    dependsOn(tasks.named("runP10cOffWriter"))
    doFirst {
        writeP10cServerProperties("p10c-enabled")
    }
}

tasks.register("cloneP10cEnabledSave") {
    dependsOn(tasks.named("runP10cEnabledWriter"))
    outputs.dir(p10cProofDirectory.map { directory -> directory.dir("saves/p10c-enabled-copy") })
    doLast {
        File source = p10cProofDirectory.get().dir("saves/p10c-enabled").asFile
        File destination = p10cProofDirectory.get().dir("saves/p10c-enabled-copy").asFile
        if (!new File(source, "level.dat").isFile()) {
            throw new GradleException("The enabled P10C save was not closed before copying")
        }
        project.copy {
            from(source)
            into(destination)
        }
        if (!new File(destination, "level.dat").isFile()) {
            throw new GradleException("The copied P10C save is incomplete")
        }
    }
}

tasks.named("runP10cClientLifecycle").configure {
    dependsOn(tasks.named("cloneP10cEnabledSave"))
}

tasks.register("verifyP10cConsentLifecycleProof") {
    dependsOn(tasks.named("runP10cClientLifecycle"))
    doLast {
        File proofDirectory = p10cProofDirectory.get().dir("proof").asFile
        File offWriter = new File(proofDirectory, "off-writer.ok")
        File enabledWriter = new File(proofDirectory, "enabled-writer.ok")
        File client = new File(proofDirectory, "client.ok")
        File failure = new File(proofDirectory, "client.failed")
        if (!offWriter.isFile() || offWriter.getText("UTF-8") != "off_writer=true\n") {
            throw new GradleException("The P10C off writer did not produce its exact receipt")
        }
        if (!enabledWriter.isFile()
                || enabledWriter.getText("UTF-8") != "enabled_writer=true\n") {
            throw new GradleException("The P10C enabled writer did not produce its exact receipt")
        }
        String expected = "restart=true copy=true sync=true refresh=true logout_reset=true off_reconnect=true\n"
        if (!client.isFile() || client.getText("UTF-8") != expected) {
            String detail = failure.isFile() ? failure.getText("UTF-8").trim() : "missing receipt"
            throw new GradleException("The P10C client lifecycle proof did not pass: " + detail)
        }
        if (failure.exists()) {
            throw new GradleException("The P10C client retained a failure receipt")
        }
        logger.lifecycle("P10C consent lifecycle proof verified: restart, copy, sync, refresh, reset, off reconnect")
    }
}

