tasks.register("verifyGameTestCount") {
    doLast {
        if ("false".equalsIgnoreCase(System.getProperty("slabbed.lawGate"))) {
            throw new GradleException(
                    "slabbed.lawGate=false is characterization-only and cannot satisfy runGameTest/check")
        }
        File log = gameTestDirectory.get().file("logs/latest.log").asFile
        if (!log.isFile()) {
            throw new GradleException("GameTest log was not created: " + log)
        }
        def successSummaries = []
        log.eachLine("UTF-8") { line ->
            def summary = (line =~ /^\[[^\]]+\] \[Server thread\/INFO\] \[net\.minecraft\.gametest\.framework\.GameTestServer\/\]: All (\d+) required tests passed :\)$/)
            if (summary.matches()) {
                successSummaries.add(summary.group(1).toInteger())
            }
        }
        if (successSummaries.size() != 1) {
            throw new GradleException("Expected exactly one authoritative GameTest success summary in " + log)
        }
        def expectedProcess = new ProcessBuilder("python3", "tools/expected-gametest-count.py")
                .directory(project.projectDir)
                .redirectErrorStream(true)
                .start()
        String expectedOutput = expectedProcess.inputStream.getText("UTF-8").trim()
        if (expectedProcess.waitFor() != 0) {
            throw new GradleException("Expected GameTest count check failed: " + expectedOutput)
        }
        int expected = expectedOutput.toInteger()
        int actual = successSummaries.first()
        if (actual != expected) {
            throw new GradleException("GameTest count mismatch: expected " + expected + ", runner reported " + actual)
        }
        logger.lifecycle("GameTest count verified: " + actual)
    }
}

tasks.named("runServerGameTest").configure {
    finalizedBy(tasks.named("verifyGameTestCount"))
}

