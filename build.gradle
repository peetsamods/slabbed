plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            vmArgs "-Dmixin.debug=true", "-Dmixin.verbose=true", "-Dmixin.dumpTargetOnFailure=true", "-Dslabbed.debug.sbsb=true"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
    }
}

// Forward -Dslabbed.sweep from the gradle invocation into the forked gametest JVM so
// `./gradlew runGameTest -Dslabbed.sweep=true` reaches RegistrySweepTest. Loom run tasks do NOT
// inherit the daemon's -D properties by default; RunConfigSettings.property() wires it through.
// (RegistrySweepTest also honours the SLABBED_SWEEP env var directly as a fallback.)
// The SAME forwarding must reach the client gametest JVM, so -Dslabbed.frozenDy=... on the gradle
// invocation reaches it the way it already reaches gameTest.
//
// The in-JVM default here is the SHIPPED one (true), and must stay that way. The client suite exists to
// prove the LAW 1 read contract on a real client — a placed cell's live read IS its stored fact — and
// four of its five entrypoints assert live and stored are one value. Forcing this JVM frozen-OFF
// disables the mechanism those tests exist to prove, so they cannot pass by construction; a client
// suite that only goes green frozen-OFF is proving nothing about the shipped jar.
// Fact-less setBlock scenery is the FIXTURE's job to author (FrozenDySceneFixture), never the runner's
// to work around by turning the store off. Do not re-add a frozen-OFF default here.
loom {
    runs {
        configureEach {
            if (name == "clientGameTest") {
                property "slabbed.sweep", System.getProperty("slabbed.sweep", "false")
                property "slabbed.frozenDy", System.getProperty("slabbed.frozenDy", "true")
                // Per-case selectors. The entrypoints already branch on these, so without forwarding
                // the selected paths are unreachable dead proof code. Forward only when set: each
                // selector rejects an empty string, so a blank default would fail every run.
                ["slabbed.c3.clientCase",
                 "slabbed.test23.recorderCase",
                 "slabbed.test28.deepHeldUseCase"].each { selector ->
                    String requested = System.getProperty(selector)
                    if (requested != null) {
                        property selector, requested
                    }
                }
            }
        }
        gameTest {
            property "slabbed.sweep", System.getProperty("slabbed.sweep", "false")
            // Keep the gametest JVM at the frozen-OFF compatibility floor (design §4.1) even though the
            // shipped default flipped ON in C1. Every existing expectation — the S-2 expected-red
            // subjects, the RegistrySweep BASELINE (recorded frozen-OFF), and the law tests that flip
            // FROZEN_DY_ENABLED in-process and restore to the *default* — stays valid because the
            // in-JVM default here is false. -Dslabbed.frozenDy=... on the gradle invocation still wins.
            // The shipped (property-absent) default of true is asserted by
            // LandingRuleLawTest#shippedFrozenDyDefaultIsOn.
            property "slabbed.frozenDy", System.getProperty("slabbed.frozenDy", "false")
        }
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Client-only modules for the client source set when splitEnvironmentSourceSets is enabled.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-renderer-api-v1:${project.fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-model-loading-api-v1:${project.fabric_version}"

    // fabric-gametest-api-v1 is included in fabric-api bundle (already on main classpath,
    // extended to the gametest source set by configureTests { createSourceSet = true })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it's present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------------------------
// ONE shared exclusion set for BOTH release artifacts (mod jar and sources jar).
//
// The two lists used to be maintained separately and DRIFTED apart: six units shipped as source
// only, including the ScreenshotFlightLock tombstone. verifyReleaseAllowlist now fails on any
// drift (one allowlist covers both jars), so this shared list is defence in depth: the exclusion
// sets CANNOT diverge again because there is only one of them.
//
// Patterns are logical-unit shaped: "pkg/Foo*" covers Foo.class, Foo$Nested.class and Foo.java
// at once, so the same list is correct for the binary jar and the sources jar.
// ---------------------------------------------------------------------------------------------
def releaseArtifactExclusions = [
        // Dev/debug source trees (never shipped).
        "com/slabbed/dev/**",
        "com/slabbed/debug/**",
        "com/slabbed/client/debug/**",
        "com/slabbed/mixin/debug/**",
        // The /slabrig live-test rig family is DEV-ONLY by the release-allowlist ruling: the
        // ships-in-every-jar standing rule covers /slabdy and /slabdev only, not the rig.
        // Registration is dev-gated in Slabbed.initDevFeatures; the classes leave both artifacts.
        "com/slabbed/command/**",                          // SlabRigCommand + 14 SlabRig* units, SlabKitCommand, SlabCheckCommand
        "com/slabbed/util/SlabTestKit*",                   // exists only to feed /slabkit and /slabrig mega
        // SlabdyRowFormatter is NO LONGER excluded: /slabdy row is a shipped consumer as of the
        // standing-rule compliance pass, and it is the one subcommand that works for real on a
        // release jar. See RELEASE_ALLOWLIST.md for its approval row.
        "com/slabbed/mixin/PaintingRigDropCaptureMixin*",  // dev-only mixin, moved to slabbed.rig.mixins.json (gametest mod)
        // Inert mixin: listed in NO mixin config and referenced nowhere; added unwired in
        // 7e4cec1d (0.2.0-beta.1-hotfix.2) and never registered since. Kept in the repo,
        // excluded from the artifacts; deleting the source is a separate decision.
        "com/slabbed/mixin/SlabBlockPlacementFixMixin*",
        // Diagnostic and capture seams that must not reach a public artifact.
        "com/slabbed/util/DebugTraceContext*",
        // NARROWED from the prefix glob "SlabbedDebug*". That glob was a name-shaped trap: it drops
        // any future unit whose name merely STARTS with SlabbedDebug, and it silently swallowed the
        // shipped SlabbedDebugCommandTree on first write (caught only by verifyReleaseAllowlist
        // reporting the approval as STALE — a warning, not a failure). These two patterns cover
        // exactly the same unit, SlabbedDebug and its nest members, and nothing else. Nothing is
        // weakened: SlabbedDebug is NOT on the allowlist, so if it ever reached an artifact the
        // build would fail with unapproved=1 rather than pass quietly.
        "com/slabbed/util/SlabbedDebug.*",
        "com/slabbed/util/SlabbedDebug\$*",
        "com/slabbed/util/RuntimeDiagnostics*",
        "com/slabbed/util/SlabbedAuditBridge*",
        "com/slabbed/util/Beta4PlacementAuthorRecorder*",
        "com/slabbed/client/GapFillerOverlay*",
        "com/slabbed/client/SlabbedClientFlags*",          // only member fed the excluded GapFillerOverlay
        "com/slabbed/client/ScreenshotCaptureService*",
        "com/slabbed/client/ScreenshotCaptureContext*",
        "com/slabbed/client/ScreenshotFlightLock*",        // tombstone file ("removed per instructions")
        "com/slabbed/client/CaptureProfile*",
        "com/slabbed/client/DyFingerprintDump*",
        // Non-shippable resources.
        "slabbed.debug.mixins.json",
        "**/.gitkeep"
]

tasks.named("sourcesJar", Jar).configure {
    // Keep generated release source artifacts aligned with the public runtime jar: SAME list.
    releaseArtifactExclusions.each { pattern -> exclude(pattern) }
}

