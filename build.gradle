plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            vmArgs "-Dmixin.debug=true", "-Dmixin.verbose=true", "-Dmixin.dumpTargetOnFailure=true", "-Dslabbed.debug.sbsb=true"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
    }
}

// Forward -Dslabbed.sweep from the gradle invocation into the forked gametest JVM so
// `./gradlew runGameTest -Dslabbed.sweep=true` reaches RegistrySweepTest. Loom run tasks do NOT
// inherit the daemon's -D properties by default; RunConfigSettings.property() wires it through.
// (RegistrySweepTest also honours the SLABBED_SWEEP env var directly as a fallback.)
loom {
    runs {
        gameTest {
            property "slabbed.sweep", System.getProperty("slabbed.sweep", "false")
            // Keep the gametest JVM at the frozen-OFF compatibility floor (design §4.1) even though the
            // shipped default flipped ON in C1. Every existing expectation — the S-2 expected-red
            // subjects, the RegistrySweep BASELINE (recorded frozen-OFF), and the law tests that flip
            // FROZEN_DY_ENABLED in-process and restore to the *default* — stays valid because the
            // in-JVM default here is false. -Dslabbed.frozenDy=... on the gradle invocation still wins.
            // The shipped (property-absent) default of true is asserted by
            // LandingRuleLawTest#shippedFrozenDyDefaultIsOn.
            property "slabbed.frozenDy", System.getProperty("slabbed.frozenDy", "false")
        }
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Client-only modules for the client source set when splitEnvironmentSourceSets is enabled.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-renderer-api-v1:${project.fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-model-loading-api-v1:${project.fabric_version}"
    // The key-mapping module publishes under its own version, not the bundle version, so resolve it
    // through the bundle POM (fabricApi.module) rather than a hard-coded coordinate.
    implementation fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)

    // fabric-gametest-api-v1 is included in fabric-api bundle (already on main classpath,
    // extended to the gametest source set by configureTests { createSourceSet = true })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

