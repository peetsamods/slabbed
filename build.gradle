}

// ── Anti-false-green: the reported suite count must match tools/expected-gametest-count.py ──────
// A stale build/run/gameTest silently drops tests and still prints BUILD SUCCESSFUL. The count check
// existed as a script and as a documented instruction, but NOTHING executed it — so the one gate that
// catches a silent drop only ran when a human remembered. This wires it into runGameTest itself.
//
// Absence of the count line is RED, not a pass: a run that reports no count is never proof.
def slabbedReportedGameTestCount = new java.util.concurrent.atomic.AtomicInteger(-1)

def slabbedExpectedGameTestCount = { File repoRoot ->
    def process = new ProcessBuilder("python3", "tools/expected-gametest-count.py")
            .directory(repoRoot)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.text
    if (process.waitFor() != 0) {
        throw new GradleException("verifyGameTestCount: the expected-count script failed:\n" + output)
    }
    def matched = (output =~ /expected suite count (\d+)/)
    if (!matched) {
        throw new GradleException(
                "verifyGameTestCount: could not read an expected count from the script. It said:\n" + output)
    }
    return matched[0][1] as int
}

tasks.matching { it.name == "runGameTest" }.configureEach { gameTestTask ->
    gameTestTask.logging.addStandardOutputListener({ CharSequence chunk ->
        def matcher = (chunk =~ /All (\d+) required tests passed/)
        while (matcher.find()) {
            slabbedReportedGameTestCount.set(Integer.parseInt(matcher.group(1)))
        }
    } as StandardOutputListener)

    gameTestTask.doLast {
        def expected = slabbedExpectedGameTestCount(rootDir)
        def reported = slabbedReportedGameTestCount.get()
        if (reported < 0) {
            throw new GradleException(
                    "verifyGameTestCount: runGameTest printed no \"All N required tests passed\" line, so "
                            + "nothing proves the suite ran. Treat this as RED.")
        }
        if (reported != expected) {
            throw new GradleException(
                    "verifyGameTestCount: reported ${reported} but expected ${expected}. A green with the "
                            + "wrong count is a false green. If reported is lower, a stale run dir most "
                            + "likely dropped tests: rm -rf build/run/gameTest and re-run.")
        }
        logger.lifecycle("verifyGameTestCount: ${reported} tests ran, matching the expected ${expected}.")
    }
}

// Jar-identity stamp: a jar must be traceable to its exact commit from its own bytes. Two different
// artifacts have shipped self-identifying as the same fabric.mod.json version, and a live session was
// once analyzed against the wrong build. Read at runtime by com.slabbed.util.BuildStamp.
def slabbedGitSha = { ->
    try {
        def head = 'git rev-parse --short=10 HEAD'.execute(null, rootDir).text.trim()
        if (head.isEmpty()) {
            return 'unknown'
        }
        def dirty = 'git status --porcelain'.execute(null, rootDir).text.trim()
        return dirty.isEmpty() ? head : head + '-dirty'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()
def slabbedBuildTime = java.time.Instant.now().toString()

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }

    manifest {
        attributes 'Slabbed-Git-Sha': slabbedGitSha,
                   'Slabbed-Build-Time': slabbedBuildTime
    }

    // Exclude dev-only and debug-only content from the public release jar: the SAME shared list
    // the sources jar uses (releaseArtifactExclusions above) so the two sets cannot drift again.
    releaseArtifactExclusions.each { pattern -> exclude(pattern) }
}

// ---------------------------------------------------------------------------------------------
// Manifest hygiene: never advertise a class the artifact does not contain.
//
// Loom computes Fabric-Loom-Client-Only-Entries from the CLIENT SOURCE SET OUTPUT, not from the
// entries that survive into the archive, and its only public hook (getAdditionalClientOnlyEntries)
// is ADDITIVE. So the released mod jar's manifest named 42 entries, 5 of which the exclusion list
// above had already removed:
//
//     com/slabbed/client/SlabbedClientFlags.class
//     com/slabbed/client/ScreenshotCaptureContext.class
//     com/slabbed/client/ScreenshotCaptureContext$State.class
//     com/slabbed/client/DyFingerprintDump.class
//     com/slabbed/client/CaptureProfile.class
//
// Same defect the 1.21.11 line diagnosed and fixed in 207863f0 (item V2). The port difference: that
// line is Yarn-mapped and ships remapJar/remapSourcesJar, so the doLast attached there. This line is
// Mojang-mapped and has NO remap tasks at all -- `jar` and `sourcesJar` ARE the shipped artifacts,
// so the doLast attaches directly to them.
//
// The fix is stated as a SUBTRACTION of names that have no matching archive entry. Two properties
// follow from that framing and are the whole reason it is the least-bad option:
//   * it cannot drop a real entry -- a name is only removed when the archive provably lacks it;
//   * it cannot go stale -- whatever releaseArtifactExclusions becomes later, the attribute is
//     re-derived from what is actually in the finished archive, not from a second list to forget.
//
// It runs in doLast, so Gradle snapshots the pruned archive as the task's output and UP-TO-DATE
// checking still works. It returns without touching a byte when the attribute is absent (the
// sources jar) or already honest, so it perturbs nothing it does not have to.
def pruneClientOnlyEntriesManifest = { File artifact ->
    String attribute = "Fabric-Loom-Client-Only-Entries"
    Map<String, byte[]> contents = new LinkedHashMap<>()
    Map<String, Long> times = new LinkedHashMap<>()
    Set<String> directories = new LinkedHashSet<>()

    new java.util.zip.ZipFile(artifact).withCloseable { zip ->
        for (entry in zip.entries()) {
            if (contents.containsKey(entry.name)) {
                // A rebuild keyed by entry name would silently collapse duplicates into one.
                // Neither release archive has any (Gradle writes each path once here), so this is
                // a loud stop rather than a quiet edit of somebody's jar.
                throw new GradleException(
                        "Cannot prune ${attribute} in ${artifact.name}: duplicate archive entry "
                                + "'${entry.name}'. Rebuilding would drop one of them.")
            }
            times.put(entry.name, entry.time)
            if (entry.directory) {
                directories.add(entry.name)
                contents.put(entry.name, new byte[0])
            } else {
                contents.put(entry.name, zip.getInputStream(entry).bytes)
            }
        }
    }

    byte[] manifestBytes = contents.get("META-INF/MANIFEST.MF")
    if (manifestBytes == null) {
        return
    }
    def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(manifestBytes))
    String declared = manifest.mainAttributes.getValue(attribute)
    if (declared == null || declared.isEmpty()) {
        return
    }

    List<String> present = declared.split(";").findAll { contents.containsKey(it) }
    List<String> missing = declared.split(";").findAll { !contents.containsKey(it) }
    if (missing.isEmpty()) {
        return
    }

    if (present.isEmpty()) {
        manifest.mainAttributes.remove(new java.util.jar.Attributes.Name(attribute))
    } else {
        manifest.mainAttributes.putValue(attribute, present.join(";"))
    }
    def rewritten = new ByteArrayOutputStream()
    manifest.write(rewritten)
    contents.put("META-INF/MANIFEST.MF", rewritten.toByteArray())

    def rebuilt = new File(artifact.parentFile, artifact.name + ".manifest-pruned")
    new java.util.zip.ZipOutputStream(new FileOutputStream(rebuilt)).withCloseable { out ->
        contents.each { name, bytes ->
            def entry = new java.util.zip.ZipEntry(name)
            long time = times.get(name)
            if (time >= 0) {
                entry.time = time
            }
            out.putNextEntry(entry)
            if (!directories.contains(name)) {
                out.write(bytes)
            }
            out.closeEntry()
        }
    }
    java.nio.file.Files.move(rebuilt.toPath(), artifact.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("[hygiene] ${artifact.name}: dropped ${missing.size()} "
            + "${attribute} name(s) with no matching archive entry: ${missing.join(', ')}")
}

// Both shipped artifacts, for the same reason the exclusion list covers both: the sources jar
// carries no such attribute today, and nothing guarantees it never will.
["jar", "sourcesJar"].each { archiveTaskName ->
    tasks.named(archiveTaskName, Jar).configure {
        doLast { task -> pruneClientOnlyEntriesManifest(task.archiveFile.get().asFile) }
    }
}

def releaseHygieneForbiddenTokens = [
        "LiveCursorIntentRecorder",
        "SlabModelStaleSentinel",
        "TargetDyOverlay",
        "SlabModelStaleSentinelClient",
        "TargetDyHudMixin",
        "CasePlacementProbeForTests",
        "CasePostUseTestHook",
        "BlockItemTestFixture",
        "TestSnapshot",
        "slabbed_diagnostics"
]

tasks.register("verifyReleaseJarHygiene") {
    group = "verification"
    description = "Fails when public binaries or sources retain diagnostic or GameTest-only seams."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })

    doLast {
        [
                tasks.named("jar").get().archiveFile.get().asFile,
                tasks.named("sourcesJar").get().archiveFile.get().asFile
        ].each { archive ->
            def violations = []
            def entryNames = new HashSet<String>()
            def manifestBytes = null
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory) {
                        entryNames.add(entry.name)
                        def bytes = zip.getInputStream(entry).readAllBytes()
                        if (entry.name == "META-INF/MANIFEST.MF") {
                            manifestBytes = bytes
                        }
                        def content = new String(
                                bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        releaseHygieneForbiddenTokens.each { token ->
                            if (content.contains(token)) {
                                violations.add("${entry.name} -> ${token}")
                            }
                        }
                    }
                }
            }
            if (!violations.isEmpty()) {
                throw new GradleException(
                        "Release hygiene violation in ${archive.name}:\n"
                                + violations.unique().sort().join("\n"))
            }

            // Manifest honesty: an artifact must never ADVERTISE a class it does not contain.
            // Loom derives Fabric-Loom-Client-Only-Entries from the client source-set output, so
            // every unit releaseArtifactExclusions drops stays named in the manifest -- 5 of the
            // mod jar's 42 names were phantoms before pruneClientOnlyEntriesManifest. This asserts
            // the prune actually ran on the FINISHED archive: if that doLast is ever detached,
            // reordered behind this gate, or defeated by a new archive path, the build goes red
            // here instead of shipping a manifest that lies about its own contents.
            if (manifestBytes != null) {
                def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(manifestBytes))
                def declared = manifest.mainAttributes.getValue("Fabric-Loom-Client-Only-Entries")
                if (declared != null && !declared.isEmpty()) {
                    def phantom = declared.split(";").findAll { !entryNames.contains(it) }
                    if (!phantom.isEmpty()) {
                        throw new GradleException(
                                "Manifest hygiene violation in ${archive.name}: "
                                        + "Fabric-Loom-Client-Only-Entries names ${phantom.size()} "
                                        + "entry/entries the archive does not contain:\n  "
                                        + phantom.sort().join("\n  "))
                    }
                }
            }
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Release artifact allowlist -- the INVERTED hygiene gate.
//
// releaseHygieneForbiddenTokens above is a DENYLIST: it can only catch names somebody thought to
// forbid. The jar/sourcesJar exclude() lists are likewise lists of things to DROP. Neither can see
// a package nobody thought about -- which is exactly how the V palette screen and /slabrig shipped
// in release/mc262-0.5.0-alpha.1 (com/slabbed/client/palette/** and com/slabbed/command/** matched
// nothing in either list).
//
// This gate is closed-world: every logical unit reaching a release artifact must match a reviewed
// row in RELEASE_ALLOWLIST.md, and the build FAILS naming anything that does not. The denylist is
// deliberately RETAINED as an independent second layer -- see RELEASE_ALLOWLIST.md for how the two
// interact and why neither subsumes the other.
// ---------------------------------------------------------------------------------------------

def releaseAllowlistFile = rootProject.file("RELEASE_ALLOWLIST.md")

// Collapse an archive entry to a "logical unit" so ONE allowlist row covers a class, its nest
// members and its source file: Foo.class, Foo$Bar.class and Foo.java all key to ".../Foo".
// Anything that is not a class or a source keeps its literal path (fabric.mod.json, assets/...).
def releaseLogicalUnit = { String entryName ->
    def name = entryName
    if (name.endsWith(".class")) {
        name = name.substring(0, name.length() - ".class".length())
        int lastSlash = name.lastIndexOf('/')
        int nest = name.indexOf('$', lastSlash + 1)
        if (nest >= 0) {
            name = name.substring(0, nest)
        }
    } else if (name.endsWith(".java")) {
        name = name.substring(0, name.length() - ".java".length())
    }
    return name
}

// pkg/**  -> that package and every subpackage, recursively (resource trees only, by policy)
// pkg/*   -> DIRECT members only; a brand-new subpackage is NOT covered. This is the palette
//            failure encoded as a rule.
// pkg/Foo -> exactly that one logical unit
def releaseAllowlistMatches = { String pattern, String unit ->
    if (pattern.endsWith("/**")) {
        return unit.startsWith(pattern.substring(0, pattern.length() - 2))
    }
    if (pattern.endsWith("/*")) {
        def prefix = pattern.substring(0, pattern.length() - 1)
        return unit.startsWith(prefix) && !unit.substring(prefix.length()).contains("/")
    }
    return unit == pattern
}

// Reads the "## Approved ..." sections of RELEASE_ALLOWLIST.md. Only table rows whose first cell is
// a backticked token count as entries, and only inside an "## Approved" section -- the explanatory
// tables elsewhere in the document are documentation, not approvals.
def parseReleaseAllowlist = { File file ->
    if (!file.exists()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md is missing at ${file.absolutePath}.\n"
                        + "The release allowlist is mandatory. Restore it from git -- deleting it is\n"
                        + "not a way to make this gate pass.")
    }
    def approved = new LinkedHashMap<String, String>()
    boolean inApprovedSection = false
    file.eachLine("UTF-8") { rawLine ->
        def line = rawLine.trim()
        if (line.startsWith("## ")) {
            inApprovedSection = line.toLowerCase(java.util.Locale.ROOT).startsWith("## approved")
            return
        }
        if (!inApprovedSection || !line.startsWith("|")) {
            return
        }
        def cells = line.split("\\|", -1).collect { it.trim() }
        if (cells.size() < 4) {
            return
        }
        def entry = cells[1]
        def reason = cells[2]
        if (entry.length() <= 2 || !entry.startsWith("`") || !entry.endsWith("`")) {
            return
        }
        entry = entry.substring(1, entry.length() - 1).trim()
        if (entry.isEmpty()) {
            return
        }
        if (reason.replace("`", "").trim().isEmpty()) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md entry '${entry}' has no reason.\n"
                            + "An approval with no reason is how the list rots. Give it one.")
        }
        if (approved.containsKey(entry)) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md lists '${entry}' twice. Keep one row per entry.")
        }
        approved.put(entry, reason)
    }
    if (approved.isEmpty()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md parsed to zero approved entries.\n"
                        + "Either the '## Approved' sections were emptied or the table format was broken.\n"
                        + "Entry rows must look like: | `com/slabbed/pkg/*` | reason |")
    }
    return approved
}

// Returns [unapproved: Map<unit, SortedSet<archiveName>>, stale: SortedSet<pattern>]
def scanReleaseArtifacts = { List<File> archives ->
    def approved = parseReleaseAllowlist(releaseAllowlistFile)
    def unapproved = new TreeMap<String, TreeSet<String>>()
    def matchedPatterns = new HashSet<String>()
    archives.each { archive ->
        if (!archive.exists()) {
            throw new GradleException(
                    "Release artifact ${archive.absolutePath} does not exist; cannot verify it.")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory) {
                    return
                }
                def unit = releaseLogicalUnit(entry.name)
                def hit = approved.keySet().find { pattern ->
                    releaseAllowlistMatches(pattern, unit)
                }
                if (hit != null) {
                    matchedPatterns.add(hit)
                } else {
                    unapproved.computeIfAbsent(unit, { new TreeSet<String>() }).add(archive.name)
                }
            }
        }
    }
    def stale = new TreeSet<String>(approved.keySet())
    stale.removeAll(matchedPatterns)
    return [unapproved: unapproved, stale: stale]
}

def releaseAllowlistArchives = { ->
    [
            tasks.named("jar").get().archiveFile.get().asFile,
            tasks.named("sourcesJar").get().archiveFile.get().asFile
    ]
}

tasks.register("verifyReleaseAllowlist") {
    group = "verification"
    description = "Fails naming every class or resource that reaches a release artifact without an "  +
            "approved entry in RELEASE_ALLOWLIST.md."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })
    inputs.file(releaseAllowlistFile)

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())

        if (!result.stale.isEmpty()) {
            logger.warn("RELEASE_ALLOWLIST.md has {} entry/entries that match nothing in either "
                    + "release artifact (stale approvals rot the list): {}",
                    result.stale.size(), result.stale.join(", "))
        }

        if (!result.unapproved.isEmpty()) {
            def detail = result.unapproved.collect { unit, archiveNames ->
                "  ${unit}\n      reached: ${archiveNames.join(', ')}"
            }.join("\n")
            throw new GradleException(
                    "Release allowlist violation: ${result.unapproved.size()} unit(s) reached a "
                            + "release artifact with no approved entry in RELEASE_ALLOWLIST.md.\n\n"
                            + detail + "\n\n"
                            + "Two legitimate responses for EACH entry above:\n"
                            + "  1. EXCLUDE it -- add exclude(\"<path>\") to BOTH the `jar` and the "
                            + "`sourcesJar` block\n"
                            + "     in build.gradle (and gate or remove whatever registers it), then rebuild.\n"
                            + "  2. APPROVE it -- add a row under an \"## Approved\" heading in "
                            + "RELEASE_ALLOWLIST.md\n"
                            + "     with a reason that would survive review. Package rows are "
                            + "`pkg/*` (direct members\n"
                            + "     only) or `pkg/**` (recursive); a bare path is a single class.\n\n"
                            + "Widening an existing pattern purely to make this green is neither. "
                            + "This gate is closed-world\n"
                            + "on purpose: anything new fails by default, because anything new used "
                            + "to SHIP by default.\n"
                            + "Run ./gradlew25 releaseAllowlistReport for the same list without "
                            + "failing the build.")
        }

        println("RELEASE_ALLOWLIST_VERIFY artifacts=${releaseAllowlistArchives().size()} "
                + "unapproved=0 stale=${result.stale.size()}")
    }
}

tasks.register("releaseAllowlistReport") {
    group = "verification"
    description = "Prints every unapproved unit in the release artifacts WITHOUT failing. Review " +
            "aid only -- it does not bypass verifyReleaseAllowlist."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })
    inputs.file(releaseAllowlistFile)
    outputs.file(layout.buildDirectory.file("reports/release-allowlist/unapproved.txt"))

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())
        def lines = []
        lines.add("# Units reaching a release artifact with no approved RELEASE_ALLOWLIST.md entry")
        lines.add("# unapproved=${result.unapproved.size()} stale=${result.stale.size()}")
        result.unapproved.each { unit, archiveNames ->
            lines.add("UNAPPROVED ${unit}\t${archiveNames.join(', ')}")
        }
        result.stale.each { pattern ->
            lines.add("STALE ${pattern}\t(approved but matches nothing)")
        }
        def reportFile = outputs.files.singleFile
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
        println(lines.join("\n"))
        println("RELEASE_ALLOWLIST_REPORT ${reportFile.absolutePath}")
    }
}

afterEvaluate {
def test35NestedJarPath = "META-INF/jars/slabbed-diagnostics.jar"
def processedMainDescriptor = layout.buildDirectory.file("resources/main/fabric.mod.json")
def processedDiagnosticsDescriptor = layout.buildDirectory.file("resources/diagnostics/fabric.mod.json")
def generatedTest35Descriptor = layout.buildDirectory.file("generated/test35/fabric.mod.json")

def diagnosticsJar = tasks.register("diagnosticsJar", Jar) {
    group = "test35 diagnostics"
    description = "Assembles the runtime-ready diagnostics source set for the TEST 35 nested jar."
    dependsOn(tasks.named("diagnosticsClasses"))
    archiveFileName.set("slabbed-diagnostics.jar")
    destinationDirectory.set(layout.buildDirectory.dir("test35/runtime-diagnostics"))
    from(sourceSets.diagnostics.output)
}

def generateTest35FabricModJson = tasks.register("generateTest35FabricModJson") {
    group = "test35 diagnostics"
    description = "Generates the TEST-only outer descriptor with one nested diagnostics declaration."
    dependsOn(tasks.named("processResources"))
    inputs.file(processedMainDescriptor)
    outputs.file(generatedTest35Descriptor)

    doLast {
        def releaseMetadata = new groovy.json.JsonSlurper().parse(processedMainDescriptor.get().asFile)
        if (releaseMetadata.containsKey("jars")) {
            throw new GradleException(
                    "Standard Slabbed descriptor unexpectedly already declares nested jars.")
        }
        releaseMetadata.jars = [[file: test35NestedJarPath]]

        def outputFile = generatedTest35Descriptor.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(releaseMetadata)) + System.lineSeparator()
    }
}

def test35DiagnosticJar = tasks.register("test35DiagnosticJar", Jar) {
    group = "test35 diagnostics"
    description = "Builds the single-file TEST 35 jar with the runtime-ready diagnostics mod nested inside."
    dependsOn(
            tasks.named("jar"),
            diagnosticsJar,
            generateTest35FabricModJson)

    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-TEST35-diagnostics.jar")
    destinationDirectory.set(layout.buildDirectory.dir("test35/bundle"))
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from({
        zipTree(tasks.named("jar").get().archiveFile.get().asFile)
    }) {
        exclude("fabric.mod.json")
        exclude("META-INF/MANIFEST.MF")
    }
    from(generatedTest35Descriptor) {
        rename { "fabric.mod.json" }
    }
    from(diagnosticsJar.flatMap { it.archiveFile }) {
        into("META-INF/jars")
    }

    doFirst {
        def releaseJar = tasks.named("jar").get().archiveFile.get().asFile
        new java.util.jar.JarFile(releaseJar).withCloseable { source ->
            if (source.manifest == null) {
                throw new GradleException("Ordinary runtime Slabbed jar has no manifest to preserve.")
            }
            def preservedAttributes = source.manifest.mainAttributes.collectEntries { key, value ->
                [(key.toString()): value.toString()]
            }
            manifest.attributes(preservedAttributes)
        }
    }
}

def verifyTest35DiagnosticJar = tasks.register("verifyTest35DiagnosticJar") {
    group = "verification"
    description = "Verifies the nested TEST 35 bundle and the unchanged release-jar boundary."
    dependsOn(
            test35DiagnosticJar,
            tasks.named("verifyReleaseJarHygiene"))
    inputs.files(
            test35DiagnosticJar.flatMap { it.archiveFile },
            diagnosticsJar.flatMap { it.archiveFile },
            tasks.named("jar").flatMap { it.archiveFile },
            processedMainDescriptor,
            processedDiagnosticsDescriptor)

    doLast {
        def bundleFile = test35DiagnosticJar.get().archiveFile.get().asFile
        def bundleCandidates = fileTree(bundleFile.parentFile) {
            include("*.jar")
        }.files
        if (bundleCandidates.size() != 1 || bundleCandidates.first() != bundleFile) {
            throw new GradleException(
                    "Expected exactly one top-level TEST 35 bundle, found: "
                            + bundleCandidates.collect { it.name }.sort())
        }

        def requiredInnerClasses = [
                "com/slabbed/dev/SlabbedDiagnostics.class",
                "com/slabbed/client/SlabbedDiagnosticsClient.class",
                "com/slabbed/util/LiveCursorIntentRecorder.class",
                "com/slabbed/util/SlabModelStaleSentinel.class",
                "com/slabbed/client/TargetDyOverlay.class",
                "com/slabbed/client/SlabModelStaleSentinelClient.class",
                "com/slabbed/mixin/client/TargetDyHudMixin.class"
        ]
        def looseDiagnosticEntries = requiredInnerClasses + [
                "slabbed.diagnostics.client.mixins.json"
        ]

        byte[] nestedJarBytes
        def outerDescriptorBytes
        def outerRootDescriptorCount = 0
        def outerNestedJarCount = 0
        def looseDiagnostics = []
        new java.util.zip.ZipFile(bundleFile).withCloseable { outer ->
            outer.entries().each { entry ->
                if (entry.name == "fabric.mod.json") {
                    outerRootDescriptorCount++
                    outerDescriptorBytes = outer.getInputStream(entry).readAllBytes()
                }
                if (entry.name == test35NestedJarPath) {
                    outerNestedJarCount++
                    nestedJarBytes = outer.getInputStream(entry).readAllBytes()
                }
                if (looseDiagnosticEntries.contains(entry.name)) {
                    looseDiagnostics.add(entry.name)
                }
            }
        }
        if (outerRootDescriptorCount != 1) {
            throw new GradleException(
                    "TEST 35 outer jar must contain one root fabric.mod.json; found "
                            + outerRootDescriptorCount)
        }
        if (outerNestedJarCount != 1 || nestedJarBytes == null) {
            throw new GradleException(
                    "TEST 35 outer jar must contain one ${test35NestedJarPath}; found "
                            + outerNestedJarCount)
        }
        if (!looseDiagnostics.isEmpty()) {
            throw new GradleException(
                    "Diagnostic implementation leaked loose into the outer jar: "
                            + looseDiagnostics.sort())
        }

        def outerMetadata = new groovy.json.JsonSlurper().parse(
                new java.io.ByteArrayInputStream(outerDescriptorBytes))
        if (outerMetadata.jars != [[file: test35NestedJarPath]]) {
            throw new GradleException(
                    "TEST 35 outer nested declaration is not exactly ${test35NestedJarPath}: "
                            + outerMetadata.jars)
        }
        def releaseMetadata = new groovy.json.JsonSlurper().parse(processedMainDescriptor.get().asFile)
        def outerWithoutJars = new LinkedHashMap(outerMetadata)
        outerWithoutJars.remove("jars")
        if (outerWithoutJars != releaseMetadata) {
            throw new GradleException(
                    "TEST 35 outer descriptor differs from release metadata beyond the nested jar.")
        }

        def innerEntryCounts = [:].withDefault { 0 }
        def innerEntryBytes = [:]
        new java.util.zip.ZipInputStream(
                new java.io.ByteArrayInputStream(nestedJarBytes)).withCloseable { inner ->
            java.util.zip.ZipEntry entry
            while ((entry = inner.nextEntry) != null) {
                if (!entry.directory) {
                    innerEntryCounts[entry.name] = innerEntryCounts[entry.name] + 1
                    if (entry.name == "fabric.mod.json"
                            || entry.name == "slabbed.diagnostics.client.mixins.json"
                            || requiredInnerClasses.contains(entry.name)) {
                        innerEntryBytes[entry.name] = inner.readAllBytes()
                    }
                }
            }
        }
        if (innerEntryCounts["fabric.mod.json"] != 1) {
            throw new GradleException(
                    "Nested diagnostics jar must contain one root fabric.mod.json; found "
                            + innerEntryCounts["fabric.mod.json"])
        }
        def duplicateInnerEntries = innerEntryCounts.findAll { _, count -> count > 1 }.keySet().sort()
        if (!duplicateInnerEntries.isEmpty()) {
            throw new GradleException(
                    "Nested diagnostics jar contains duplicate file entries: " + duplicateInnerEntries)
        }
        def requiredInnerEntries = requiredInnerClasses + [
                "slabbed.diagnostics.client.mixins.json"
        ]
        def missingInnerEntries = requiredInnerEntries.findAll {
            innerEntryCounts[it] != 1
        }
        if (!missingInnerEntries.isEmpty()) {
            throw new GradleException(
                    "Nested diagnostics jar is missing required entries: " + missingInnerEntries)
        }

        def innerMetadata = new groovy.json.JsonSlurper().parse(
                new java.io.ByteArrayInputStream(innerEntryBytes["fabric.mod.json"]))
        def expectedInnerMetadata = new groovy.json.JsonSlurper().parse(
                processedDiagnosticsDescriptor.get().asFile)
        if (innerMetadata != expectedInnerMetadata) {
            throw new GradleException(
                    "Nested diagnostics descriptor differs from the processed source descriptor.")
        }
        if (innerMetadata.id != "slabbed_diagnostics"
                || innerMetadata.entrypoints?.main != ["com.slabbed.dev.SlabbedDiagnostics"]
                || innerMetadata.entrypoints?.client != ["com.slabbed.client.SlabbedDiagnosticsClient"]
                || innerMetadata.mixins != [[
                        config: "slabbed.diagnostics.client.mixins.json",
                        environment: "client"
                ]]
                || innerMetadata.depends?.slabbed != "*") {
            throw new GradleException(
                    "Nested diagnostics metadata lost its required mod id, entrypoints, mixin, or dependency.")
        }

        def diagnosticsJarBytes = java.nio.file.Files.readAllBytes(
                diagnosticsJar.get().archiveFile.get().asFile.toPath())
        if (!java.util.Arrays.equals(nestedJarBytes, diagnosticsJarBytes)) {
            throw new GradleException(
                    "Nested diagnostics bytes do not match the runtime-ready diagnostics artifact.")
        }

        def releaseJarFile = tasks.named("jar").get().archiveFile.get().asFile

        def diagnosticTaskNames = [
                "diagnosticsJar",
                "generateTest35FabricModJson",
                "test35DiagnosticJar",
                "verifyTest35DiagnosticJar",
                "buildTest35DiagnosticJar"
        ] as Set
        def ordinaryTaskNames = [
                "build",
                "assemble",
                "check",
                "jar",
                "remapJar",
                "sourcesJar",
                "verifyReleaseJarHygiene",
                "verifyReleaseAllowlist",
                "releaseAllowlistReport",
                "publish",
                "publishToMavenLocal"
        ] + tasks.findAll { task -> task.name.startsWith("publish") }.collect { task -> task.name }
        def ordinaryDependencyLeaks = []
        ordinaryTaskNames.each { taskName ->
            def ordinaryTask = tasks.findByName(taskName)
            if (ordinaryTask != null) {
                def pending = new ArrayDeque(
                        ordinaryTask.taskDependencies.getDependencies(ordinaryTask))
                def visited = [] as Set
                while (!pending.isEmpty()) {
                    def dependency = pending.removeFirst()
                    if (visited.add(dependency)) {
                        if (diagnosticTaskNames.contains(dependency.name)) {
                            ordinaryDependencyLeaks.add("${taskName}->${dependency.name}")
                        }
                        pending.addAll(dependency.taskDependencies.getDependencies(dependency))
                    }
                }
            }
        }
        if (!ordinaryDependencyLeaks.isEmpty()) {
            throw new GradleException(
                    "Ordinary build/release/publication task depends on TEST 35 diagnostics: "
                            + ordinaryDependencyLeaks.sort())
        }

        new java.util.jar.JarFile(releaseJarFile).withCloseable { releaseJar ->
            new java.util.jar.JarFile(bundleFile).withCloseable { bundleJar ->
                def releaseManifestAttributes = releaseJar.manifest?.mainAttributes?.collectEntries { key, value ->
                    [(key.toString()): value.toString()]
                }
                def bundleManifestAttributes = bundleJar.manifest?.mainAttributes?.collectEntries { key, value ->
                    [(key.toString()): value.toString()]
                }
                if (releaseManifestAttributes == null || bundleManifestAttributes == null
                        || releaseManifestAttributes != bundleManifestAttributes) {
                    throw new GradleException(
                            "TEST 35 bundle manifest main attributes differ from the ordinary release jar.")
                }
                ["Slabbed-Git-Sha", "Slabbed-Build-Time"].each { attribute ->
                    def releaseValue = releaseJar.manifest?.mainAttributes?.getValue(attribute)
                    def bundleValue = bundleJar.manifest?.mainAttributes?.getValue(attribute)
                    if (releaseValue == null || releaseValue.trim().isEmpty()
                            || bundleValue != releaseValue) {
                        throw new GradleException(
                                "TEST 35 bundle did not preserve readable ${attribute} from the release jar.")
                    }
                }
            }
        }

        println("TEST35_VERIFY outerDescriptors=1 nestedJars=1 innerDescriptors=1 "
                + "innerClasses=${requiredInnerClasses.size()} innerDuplicateEntries=0 "
                + "manifestAttributes=equal releaseHygiene=passed releaseViolations=0 ordinaryTaskLeaks=0")
        println("TEST35_ARTIFACT ${bundleFile.absolutePath}")
    }
}

tasks.register("buildTest35DiagnosticJar") {
    group = "test35 diagnostics"
    description = "Builds and verifies the single-file TEST 35 diagnostics bundle."
    dependsOn(verifyTest35DiagnosticJar)
}
}

tasks.named("build") {
    dependsOn(tasks.named("verifyReleaseJarHygiene"))
    dependsOn(tasks.named("verifyReleaseAllowlist"))
}

// dependsOn on `build` alone is not enough: `gradle jar`, `gradle assemble`, `gradle publish` and
// `gradle buildTest35DiagnosticJar` all produce or consume a release artifact without going through
// `build`. finalizedBy on the two archive tasks makes both hygiene layers run whenever a release
// artifact is produced, by ANY entry point -- so it is not possible to end up holding a jar that was
// never checked. (finalizedBy is not a dependency edge, so the verifyTest35DiagnosticJar
// ordinary-task-leak assertion is unaffected.)
["jar", "sourcesJar"].each { archiveTaskName ->
    tasks.named(archiveTaskName) {
        finalizedBy(tasks.named("verifyReleaseJarHygiene"), tasks.named("verifyReleaseAllowlist"))
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // fetching dependencies.
    }
}

