def gameTestDirectory = layout.buildDirectory.dir("run/gameTest")
def p2bProofDirectory = layout.buildDirectory.dir("run/p2bLifecycle")
def p10cProofDirectory = layout.buildDirectory.dir("run/p10cConsentLifecycle")
def p7ProofDirectory = layout.buildDirectory.dir("run/p7Visual")
def p8ProofDirectory = layout.buildDirectory.dir("run/p8TerrainSlabs")
def p9SnowProofDirectory = layout.buildDirectory.dir("run/p9Snow")
def p9SmoothStepsProofDirectory = layout.buildDirectory.dir("run/p9SmoothSteps")
def p9SmoothStepsRedDirectory = layout.buildDirectory.dir("run/p9SmoothStepsRed")
def parityServerDirectory = layout.buildDirectory.dir("run/parityServer")

// Descriptive build identity. Exact runtime bytes remain authoritative through BuildStamp's
// content digest; this label makes a dev launch traceable to the checkout that produced it.
def slabbedGitSha = { ->
    try {
        def head = 'git rev-parse --short=10 HEAD'.execute(null, rootDir).text.trim()
        if (head.isEmpty()) {
            return 'unknown'
        }
        def dirty = 'git status --porcelain'.execute(null, rootDir).text.trim()
        return dirty.isEmpty() ? head : head + '-dirty'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()
def slabbedBuildTime = java.time.Instant.now().toString()

sourceSets {
    main {
        java {
            srcDir "src/client/java"
            // NeoForge bootstrap: keep dev/debug/manual recorder implementations out
            // of main compile until that optional tooling lane is ported deliberately.
            exclude "com/slabbed/debug/**"
            exclude "com/slabbed/dev/**"
            exclude "com/slabbed/client/debug/**"
            exclude "com/slabbed/client/CaptureProfile.java"
            exclude "com/slabbed/client/GapFillerOverlay.java"
            exclude "com/slabbed/client/NeoForgeChainCeilingClientProof.java"
            exclude "com/slabbed/client/NeoForgeClientProofCanary.java"
            exclude "com/slabbed/client/NeoForgeClientWorldProof.java"
            exclude "com/slabbed/client/NeoForgeFenceGateClientProof.java"
            exclude "com/slabbed/client/ScreenshotCaptureContext.java"
            exclude "com/slabbed/client/ScreenshotCaptureService.java"
            exclude "com/slabbed/client/ScreenshotFlightLock.java"
            exclude "com/slabbed/client/TargetDyOverlay.java"
            exclude "com/slabbed/client/runtime/ModelDyTranslateTraceBridge.java"
            exclude "com/slabbed/mixin/BlockItemPlaceTraceMixin.java"
            exclude "com/slabbed/mixin/SlabBlockPlacementFixMixin.java"
            exclude "com/slabbed/mixin/client/Beta*.java"
            exclude "com/slabbed/mixin/debug/**"
            exclude "com/slabbed/util/Beta4ManualLiveTrace.java"
            exclude "com/slabbed/util/Beta4PlacementAuthorRecorder.java"
            exclude "com/slabbed/util/Beta35FenceWallLiveInspectRecorder.java"
            exclude "com/slabbed/util/Beta35LiveTorchCaptureRecorder.java"
            exclude "com/slabbed/util/Beta35SlabHeightHitAcceptanceRecorder.java"
            exclude "com/slabbed/util/Beta35SlabJumpSourceTruthRecorder.java"
            exclude "com/slabbed/util/DebugTraceContext.java"
            exclude "com/slabbed/util/Mc1211TrapdoorUnderBottomRecorder.java"
            exclude "com/slabbed/util/SlabbedAuditBridge.java"
            exclude "com/slabbed/util/SlabbedDebug.java"
        }
        resources {
            srcDir "src/client/resources"
            exclude "fabric.mod.json"
            exclude "slabbed.debug.mixins.json"
        }
    }
    gametest {
        java {
            setSrcDirs(["src/gametest/java", "src/main/java"])
            setIncludes([
                    "com/slabbed/test/CeilingFlushRulingTest.java",
                    "com/slabbed/test/ChainColumnLoweredCapCoherenceTest.java",
                    "com/slabbed/test/ChainSurvivalReproTest.java",
                    "com/slabbed/test/CombinedSlabChainingMatrixTest.java",
                    "com/slabbed/test/DeepDyConsentTest.java",
                    "com/slabbed/test/DySpecificationTest.java",
                    "com/slabbed/test/LegacySupportSeatResolutionTest.java",
                    "com/slabbed/test/Mc1211GoblinRouteCanaryGameTest.java",
                    "com/slabbed/test/NeighborUpdateInvarianceTest.java",
                    "com/slabbed/test/NeverPopBreadthTest.java",
                    "com/slabbed/test/P6InteractionParityTest.java",
                    "com/slabbed/test/P7VisualParityTest.java",
                    "com/slabbed/test/SlabPlacementHeightPersistenceSyncTest.java",
                    "com/slabbed/test/SlabPlacementHeightLifecycleTest.java",
                    "com/slabbed/test/SlabPlacementHeightResolverTest.java",
                    "com/slabbed/test/SlabPlacementHeightSchemaTest.java",
                    "com/slabbed/test/SlabbedHotPathAllocationRegressionTest.java",
                    "com/slabbed/test/SlabHeightStepCullTest.java",
                    "com/slabbed/test/SlabbedLabFixtureTest.java",
                    "com/slabbed/test/TerrainSlabsHeadlessClassifierTest.java",
                    "com/slabbed/test/UpFaceEdgeCombineGuardTest.java",
                    "com/slabbed/test/VanillaDownstreamOwnershipTest.java",
                    "com/slabbed/dev/SlabbedLabFixtures.java"
            ])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    p2btest {
        java {
            setSrcDirs(["src/p2btest/java"])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    p7test {
        java {
            setSrcDirs(["src/p7test/java"])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    p8test {
        java {
            setSrcDirs(["src/p8test/java"])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    p9snowtest {
        java {
            setSrcDirs(["src/p9snowtest/java"])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    p9smoothstepstest {
        java {
            setSrcDirs(["src/p9smoothstepstest/java"])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    // Standalone classifier shim that claims the Terrain Slabs mod id inside the
    // GameTest server only. It must never depend on main and must never ship.
    tsshim {
        java {
            setSrcDirs(["src/tsshim/java"])
        }
        resources {
            setSrcDirs(["src/tsshim/resources"])
        }
        runtimeClasspath += output
    }
    // Dev-only diagnostics lane: recorder, rig builder, and target-dy display. Compiles
    // against main but is its own mod, loaded only by dev run configurations; the jar task
    // never sees it and the release hygiene gate proves the shipping jar cannot name it.
    devtools {
        java {
            setSrcDirs(["src/devtools/java"])
        }
        resources {
            setSrcDirs(["src/devtools/resources"])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    // Code-free environment source sets: they exist only so a run configuration can
    // carry real optional mods on its classpath. The real Terrain Slabs and the
    // GameTest shim must never share a run.
    serverenv {
        java {
            setSrcDirs([])
        }
        resources {
            setSrcDirs([])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.p2btest
    addModdingDependenciesTo sourceSets.p7test
    addModdingDependenciesTo sourceSets.p8test
    addModdingDependenciesTo sourceSets.p9snowtest
    addModdingDependenciesTo sourceSets.p9smoothstepstest
    addModdingDependenciesTo sourceSets.tsshim
    addModdingDependenciesTo sourceSets.devtools
    addModdingDependenciesTo sourceSets.serverenv

    runs {
        client {
            client()
            // Dev-session policy: recorder and target-dy display are ON from launch.
            // Source defaults stay off; only this run configuration arms them.
            // Overridable so a session can separate PRODUCT cost from RECORDER cost without
            // editing the build: -Pslabbed.recorder=false. The recorder samples every tick and
            // every frame, and each sample re-runs shape and raycast work, so a heavy session
            // writes tens of megabytes and its cost is not small. Default stays ON - a live pass
            // without it produces no evidence, and that has been the more expensive mistake.
            systemProperty "slabbed.liveCursorIntentRecorder",
                    (findProperty("slabbed.recorder") ?: "true").toString()
            systemProperty "slabbed.targetDyOverlay", "true"
            systemProperty "slabbed.devGitSha", slabbedGitSha
            systemProperty "slabbed.devBuildTime", slabbedBuildTime
            systemProperty "slabbed.devClassesRoot", sourceSets.main.output.classesDirs.singleFile.absolutePath
            systemProperty "slabbed.devResourcesRoot", sourceSets.main.output.resourcesDir.absolutePath
        }
        server {
            server()
            programArgument "--nogui"
        }
        parityServer {
            server()
            programArgument "--nogui"
            gameDirectory = parityServerDirectory
            sourceSet = sourceSets.serverenv
        }
        serverGameTest {
            server()
            programArgument "--nogui"
            gameDirectory = gameTestDirectory
            systemProperty "neoforge.gameTestServer", "true"
            systemProperty "neoforge.enabledGameTestNamespaces", "fabric-gametest-api-v1"
            jvmArguments.addAll(providers.systemProperty("slabbed.lawGate")
                    .map { value -> ["-Dslabbed.lawGate=" + value] }
                    .orElse([]))
            taskBefore tasks.named("gametestClasses")
            taskBefore tasks.named("tsshimClasses")
        }
        p2bPersistenceWriter {
            server()
            programArgument "--nogui"
            gameDirectory = p2bProofDirectory
            systemProperty "slabbed.p2b.phase", "writer"
            taskBefore tasks.named("p2btestClasses")
        }
        p2bClientSync {
            client()
            gameDirectory = p2bProofDirectory
            systemProperty "slabbed.p2b.phase", "client"
            taskBefore tasks.named("p2btestClasses")
        }
        p10cOffWriter {
            server()
            programArgument "--nogui"
            gameDirectory = p10cProofDirectory
            systemProperty "slabbed.p10c.phase", "off-writer"
            taskBefore tasks.named("p2btestClasses")
        }
        p10cEnabledWriter {
            server()
            programArgument "--nogui"
            gameDirectory = p10cProofDirectory
            systemProperty "slabbed.p10c.phase", "enabled-writer"
            taskBefore tasks.named("p2btestClasses")
        }
        p10cClientLifecycle {
            client()
            gameDirectory = p10cProofDirectory
            systemProperty "slabbed.p10c.phase", "client"
            taskBefore tasks.named("p2btestClasses")
        }
        p7VisualClient {
            client()
            gameDirectory = p7ProofDirectory
            systemProperty "slabbed.p7.proof", "true"
            taskBefore tasks.named("p7testClasses")
        }
        p8TerrainSlabsClient {
            client()
            sourceSet = sourceSets.p8test
            gameDirectory = p8ProofDirectory
            systemProperty "slabbed.p8.proof", "true"
            taskBefore tasks.named("p8testClasses")
        }
        p9SnowClient {
            client()
            sourceSet = sourceSets.p9snowtest
            gameDirectory = p9SnowProofDirectory
            systemProperty "slabbed.p9.snow.proof", "true"
            taskBefore tasks.named("p9snowtestClasses")
        }
        p9SmoothStepsClient {
            client()
            sourceSet = sourceSets.p9smoothstepstest
            gameDirectory = p9SmoothStepsProofDirectory
            systemProperty "slabbed.p9.smooth_steps.proof", "true"
            taskBefore tasks.named("p9smoothstepstestClasses")
        }
        p9SmoothStepsRedClient {
            client()
            sourceSet = sourceSets.p9smoothstepstest
            gameDirectory = p9SmoothStepsRedDirectory
            systemProperty "slabbed.p9.smooth_steps.proof", "true"
            systemProperty "slabbed.p9.smooth_steps.expect_collision_red", "true"
            systemProperty "slabbed.collisionFollow", "false"
            taskBefore tasks.named("p9smoothstepstestClasses")
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            sourceSet sourceSets.p2btest
            sourceSet sourceSets.p7test
            sourceSet sourceSets.p8test
            sourceSet sourceSets.p9snowtest
            sourceSet sourceSets.p9smoothstepstest
        }
        tsshim {
            sourceSet sourceSets.tsshim
        }
        devtools {
            sourceSet sourceSets.devtools
        }
    }

    // The shim claims the real Terrain Slabs mod id, so it may exist ONLY inside the
    // headless GameTest server. Every other run keeps the real-mod lane (or no
    // Terrain Slabs at all); loading both the shim and the real mod would collide.
    runs.configureEach { run ->
        if (run.name == "serverGameTest") {
            run.loadedMods = [mods."${mod_id}", mods.tsshim]
        } else if (run.name == "client" || run.name == "parityServer" || run.name == "server") {
            run.loadedMods = [mods."${mod_id}", mods.devtools]
        } else {
            run.loadedMods = [mods."${mod_id}"]
        }
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    p2btestImplementation.extendsFrom implementation
    p7testImplementation.extendsFrom implementation
    p8testImplementation.extendsFrom implementation
    p9snowtestImplementation.extendsFrom implementation
    p9smoothstepstestImplementation.extendsFrom implementation
}

dependencies {
    gametestImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"
    p8testImplementation "maven.modrinth:countereds-terrain-slabs:3.1.2"
    p8testImplementation "maven.modrinth:architectury-api:13.0.8+neoforge"
    serverenvImplementation "maven.modrinth:countereds-terrain-slabs:3.1.2"
    serverenvImplementation "maven.modrinth:architectury-api:13.0.8+neoforge"
    p9snowtestImplementation "maven.modrinth:iJNje1E8:CplQCHcl"
    p9snowtestImplementation "maven.modrinth:ufdDoWPd:tfwJWC8g"
    p9snowtestImplementation "maven.modrinth:AANobbMI:Pb3OXVqC"
    p9snowtestCompileOnly "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.1+9125b6dc19"
    p9smoothstepstestImplementation "maven.modrinth:5VSZqDK0:fO1PtlIv"
