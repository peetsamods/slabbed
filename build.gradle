// RIG catalog tests must be present on both truth surfaces: compiled sources and Fabric entrypoints.
// This explicit pre-compile gate makes deleting either registration a deterministic red.
tasks.register("verifyRig2GametestRegistration") {
    inputs.file(layout.projectDirectory.file("build.gradle"))
    inputs.file(layout.projectDirectory.file("src/gametest/resources/fabric.mod.json"))
    inputs.files(sourceSets.gametest.java)
    doLast {
        def configuredSources = sourceSets.gametest.java.files.collect {
            it.canonicalPath.replace('\\', '/')
        } as Set
        [
                "RegistrySweepArtifacts.java",
                "RegistrySweepTest.java",
                "SlabRigCommandSmokeTest.java",
                "SlabRigCaseCatalogTest.java",
                "SlabRigHangingCatalogTest.java",
                "SlabRigHangingPaintingPlanTest.java",
                "SlabRigHangingKernelArtifactsTest.java",
                "SlabRigHangingPaintingKernelTest.java"
        ].each { sourceName ->
            def suffix = "/com/slabbed/test/${sourceName}"
            if (!configuredSources.any { it.endsWith(suffix) }) {
                throw new GradleException("RIG catalog gametest source registration missing: ${sourceName}")
            }
        }
        def metadata = new groovy.json.JsonSlurper().parse(
                layout.projectDirectory.file("src/gametest/resources/fabric.mod.json").asFile)
        def entrypoints = metadata.entrypoints?.get("fabric-gametest") ?: []
        [
                "com.slabbed.test.RegistrySweepTest",
                "com.slabbed.test.SlabRigCommandSmokeTest",
                "com.slabbed.test.SlabRigCaseCatalogTest",
                "com.slabbed.test.SlabRigHangingCatalogTest",
                "com.slabbed.test.SlabRigHangingPaintingPlanTest",
                "com.slabbed.test.SlabRigHangingKernelArtifactsTest",
                "com.slabbed.test.SlabRigHangingPaintingKernelTest"
        ].each { className ->
            if (!entrypoints.contains(className)) {
                throw new GradleException("RIG catalog Fabric gametest entrypoint missing: ${className}")
            }
        }
    }
}

tasks.named("compileGametestJava") {
    dependsOn(tasks.named("verifyRig2GametestRegistration"))
}

// Jar-identity stamp: a jar must be traceable to its exact commit from its own bytes. Two different
// artifacts have shipped self-identifying as the same fabric.mod.json version, and a live session was
// once analyzed against the wrong build. Read at runtime by com.slabbed.util.BuildStamp.
def slabbedGitSha = { ->
    try {
        def head = 'git rev-parse --short=10 HEAD'.execute(null, rootDir).text.trim()
        if (head.isEmpty()) {
            return 'unknown'
        }
        def dirty = 'git status --porcelain'.execute(null, rootDir).text.trim()
        return dirty.isEmpty() ? head : head + '-dirty'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()
def slabbedBuildTime = java.time.Instant.now().toString()

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }

    manifest {
        attributes 'Slabbed-Git-Sha': slabbedGitSha,
                   'Slabbed-Build-Time': slabbedBuildTime
    }

    // Exclude dev-only and debug-only content from public release jar
    exclude("com/slabbed/dev/**")
    exclude("com/slabbed/debug/**")
    exclude("com/slabbed/client/debug/**")
    exclude("com/slabbed/mixin/debug/**")
    exclude("com/slabbed/util/DebugTraceContext.class")
    exclude("com/slabbed/client/GapFillerOverlay.class")
    exclude("com/slabbed/client/ScreenshotCaptureContext*.class")
    exclude("com/slabbed/client/ScreenshotCaptureService*.class")
    exclude("com/slabbed/client/DyFingerprintDump*.class")
    exclude("com/slabbed/client/CaptureProfile.class")
    exclude("com/slabbed/util/SlabbedDebug.class")
    exclude("com/slabbed/util/Beta4PlacementAuthorRecorder.class")
    exclude("com/slabbed/util/SlabbedAuditBridge.class")
    exclude("slabbed.debug.mixins.json")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // fetching dependencies.
    }
}

