name: Slabbed CI

on:
  pull_request:
  push:
    branches:
      - "port/mc-26.3-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slabbed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The MC 26.x named jars are class-file version 69, so javac must run under JDK 25 even though
      # this project still targets release 21 bytecode. The repo's ./gradlew25 wrapper resolves 25
      # through the macOS-only /usr/libexec/java_home, so CI uses plain ./gradlew and lets
      # setup-java provide the JDK instead.
      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Reject local runtime jars
        shell: bash
        run: |
          if [ -d run/mods ] && find run/mods -type f -name '*.jar' -print -quit | grep -q .; then
            echo "Unexpected run/mods jar would contaminate the canonical server test environment."
            exit 1
          fi

      # The suite-count gate shells out to python3 from inside runGameTest; fail loudly and early
      # here rather than midway through a 30-minute job if the runner image ever drops it.
      - name: Check the suite-count gate can run
        run: python3 tools/expected-gametest-count.py

      # runGameTest self-verifies its reported count against tools/expected-gametest-count.py, so a
      # silently truncated suite fails here instead of printing a green.
      - name: Build and run server GameTests
        run: ./gradlew --no-daemon --stacktrace --console=plain build runGameTest

      # One jar serves 26.2 and 26.3 and is compiled against 26.3. The 26.2 leg compiles the same suite
      # against 26.2 and runs it on a 26.2 runtime with the exact release jar loaded; its count gate
      # compares the run against the classes the prepared descriptor registers (harness/README.md).
      - name: Run the 26.2 server GameTest leg against the release jar
        run: ./gradlew --no-daemon --stacktrace --console=plain -p harness/fabric-26.2 runGameTest verifyHarnessGameTestCount

      # Every Minecraft and Fabric API reference in the jar, and every mixin target string in the
      # registered mixins, must resolve on BOTH versions (the shipped client jars are in Loom's cache
      # after the builds above; the Fabric API bundles in Gradle's module cache).
      - name: Linkage and mixin-target scans on both game versions
        shell: bash
        run: |
          set -euo pipefail
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          JAR=$(ls build/libs/slabbed-*+26.2-26.3.jar)
          FA262=$(find "$GUH/caches/modules-2" -name 'fabric-api-0.152.2+26.2.jar' | head -1)
          FA263=$(find "$GUH/caches/modules-2" -name "fabric-api-$(grep '^fabric_version=' gradle.properties | cut -d= -f2).jar" | head -1)
          test -n "$FA262" && test -n "$FA263"
          python3 tools/linkage-scan.py "$JAR" - "$GUH/caches/fabric-loom/26.3/minecraft-client.jar" --lib "$FA263" \
            --allow-class 'com/slabbed/compat/mc262/'
          python3 tools/linkage-scan.py "$JAR" - "$GUH/caches/fabric-loom/26.2/minecraft-client.jar" --lib "$FA262" \
            --allow-class 'com/slabbed/compat/PlayerSwing$Modern' --allow-class 'com/slabbed/client/model/YOffsetEmitter'
          CFG="--config src/main/resources/slabbed.mixins.json --config src/client/resources/slabbed.client.mixins.json --config src/diagnostics/resources/slabbed.diagnostics.client.mixins.json"
          # Optional compatibility targets are absent from the vanilla scan classpath;
          # verify them with their installed mods in the compatibility client fixtures.
          python3 tools/mixin-target-scan.py "$GUH/caches/fabric-loom/26.3/minecraft-client.jar" src/main/java src/client/java src/diagnostics/java $CFG \
            --skip LegacyRedStoneWireBlockMixin --skip FusionBlockModelModifierMixin --skip StupidBlockAnimationsRendererMixin
          python3 tools/mixin-target-scan.py "$GUH/caches/fabric-loom/26.2/minecraft-client.jar" src/main/java src/client/java src/diagnostics/java $CFG \
            --skip RedstoneWireBlockMixin --skip CushionRestsOnDrawnTopMixin --skip FusionBlockModelModifierMixin --skip StupidBlockAnimationsRendererMixin

  client-verify:
    name: Client GameTests (${{ matrix.minecraft }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.2", "26.3"]
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
      # SDL3 needs an EGL context when the virtual display has no matching GLX visual.
      SDL_VIDEO_FORCE_EGL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check headless display support
        run: command -v xvfb-run
      - name: Install software graphics libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers mesa-utils
          xvfb-run -a glxinfo -B
      - name: Build release and proof companions
        run: ./gradlew --no-daemon --stacktrace --console=plain assemble testkitJar diagnosticsJar
      - name: Run the 26.2 client leg against the release jar
        if: matrix.minecraft == '26.2'
        timeout-minutes: 10
        run: xvfb-run -a ./gradlew --no-daemon --stacktrace --console=plain -p harness/fabric-26.2 runClientGameTest verifyHarnessClientLeg
      - name: Run the native 26.3 client leg
        if: matrix.minecraft == '26.3'
        timeout-minutes: 10
        run: xvfb-run -a ./gradlew --no-daemon --stacktrace --console=plain runClientGameTest
      - name: Verify every native client entrypoint completed
        if: matrix.minecraft == '26.3'
        shell: python
        run: |
          import json
          from pathlib import Path
          descriptor = json.loads(Path("src/gametest/resources/fabric.mod.json").read_text())
          entries = descriptor["entrypoints"]["fabric-client-gametest"]
          expected = [(entry["value"] if isinstance(entry, dict) else entry).rsplit(".", 1)[-1] for entry in entries]
          text = Path("build/run/clientGameTest/logs/latest.log").read_text()
          missing = [name for name in expected if f"CLIENT_GAMETEST | {name} | PASS" not in text]
          assert not missing, f"Client entrypoints without PASS markers: {missing}"
          assert not any(error in text for error in ("Mixin apply failed", "MixinApplyError", "InjectionError")), "Client mixin failure"
          print(f"Verified {len(expected)}/{len(expected)} native client entrypoints")
