name: Slabbed CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slabbed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Reject local runtime jars
        shell: bash
        run: |
          if [ -d run/mods ] && find run/mods -type f -name '*.jar' -print -quit | grep -q .; then
            echo "Unexpected run/mods jar would contaminate the canonical server test environment."
            exit 1
          fi

      # Both legs finalize with :verifyGameTestCount (build.gradle), which fails the build if the
      # reported test count differs from tools/expected-gametest-count.py — the stale-run-dir
      # false-green class is machine-gated, not a manual step.
      - name: Build and run server GameTests (default leg)
        run: ./gradlew --no-daemon --stacktrace --console=plain build runGameTest

      - name: Run server GameTests (deep dy alphabet leg)
        run: |
          rm -rf build/run/gameTest
          ./gradlew --no-daemon --stacktrace --console=plain runGameTest -Dslabbed.deepDyAlphabet=true

      - name: Upload gametest logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gametest-logs
          path: |
            build/run/gameTest/logs/
          if-no-files-found: ignore
          retention-days: 7
